<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Family Dinner Picker</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    font-family:'Nunito',sans-serif;
    color:#5a4635;

    background:
    radial-gradient(circle at top,
    rgba(255,244,210,0.95) 0%,
    rgba(245,230,200,0.92) 25%,
    rgba(225,205,175,0.96) 60%,
    rgba(205,180,145,1) 100%);

    position:relative;
}

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:0.18;

    background-image:
    repeating-radial-gradient(circle at 0 0,
    transparent 0,
    transparent 6px,
    rgba(120,90,50,0.05) 7px),

    repeating-linear-gradient(
    0deg,
    rgba(255,255,255,0.04),
    rgba(255,255,255,0.04) 1px,
    transparent 1px,
    transparent 4px);
}

.page{
    width:100%;
    min-height:100vh;

    display:grid;
    grid-template-columns:340px 1fr 280px;

    gap:45px;

    padding:30px;
}

/* LEFT PANEL */

.left-panel{

    background:
    linear-gradient(
    to bottom,
    rgba(255,248,236,0.96),
    rgba(245,232,205,0.96));

    border-radius:36px;

    padding:24px;

    position:relative;

    box-shadow:
    inset 0 0 0 3px #ead7b7,
    0 20px 45px rgba(0,0,0,0.14);
}

.panel-title{

    font-family:'Cormorant Garamond',serif;

    font-size:52px;

    text-align:center;

    color:#486638;

    margin-bottom:24px;
}

.add-row{
    display:flex;
    gap:12px;
    margin-bottom:24px;
}

.add-row input{

    flex:1;
    min-width:0;

    border:none;

    border-radius:18px;

    padding:18px;

    background:#f4ebdd;

    font-size:16px;

    outline:none;
}

.add-row button{

    width:92px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
    to bottom,
    #89ad67,
    #5e7e46);

    color:white;

    font-weight:900;

    font-size:18px;

    cursor:pointer;

    box-shadow:
    inset 0 3px 0 rgba(255,255,255,0.25),
    0 8px 16px rgba(0,0,0,0.14);
}

.restaurant-item{

    background:
    linear-gradient(
    to bottom,
    #fffdf8,
    #f5ebd7);

    border-radius:22px;

    padding:16px;

    margin-bottom:14px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:
    inset 0 0 0 2px #eadcc3,
    0 8px 18px rgba(0,0,0,0.08);
}

.restaurant-name{

    font-size:22px;
    font-weight:800;

    max-width:140px;

    overflow-wrap:break-word;
}

.item-buttons{
    display:flex;
    gap:8px;
}

.item-buttons button{

    border:none;

    border-radius:14px;

    padding:10px 14px;

    font-weight:800;

    cursor:pointer;
}

.cross-btn{

    background:#78975f;
    color:white;
}

.delete-btn{

    background:#f4d9d1;
    color:#9a5e50;
}

/* CENTER */

.center{
    text-align:center;
    position:relative;
}

.title{

    font-family:'Cormorant Garamond',serif;

    font-size:96px;

    color:#35552b;

    line-height:0.95;

    text-shadow:
    0 2px 0 #fff8df,
    0 6px 20px rgba(0,0,0,0.15);
}

.subtitle{

    margin-top:18px;

    font-size:28px;

    color:#6c5648;
}

/* MACHINE */

.machine-wrap{

    width:520px;

    margin:auto;

    margin-top:40px;

    position:relative;
}

.machine-wrap::before{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:850px;
    height:850px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(255,216,105,0.45) 0%,
    rgba(255,210,80,0.15) 30%,
    transparent 65%);

    pointer-events:none;
}

.machine-frame{

    position:relative;

    padding:22px;

    border-radius:84px;

    background:
    linear-gradient(
    145deg,
    #f3ca72 0%,
    #b97b2f 12%,
    #6b3d16 32%,
    #2f1607 52%,
    #8f5a24 76%,
    #f0be63 100%);

    box-shadow:
    inset 0 3px 8px rgba(255,255,255,0.5),
    inset 0 -10px 25px rgba(0,0,0,0.6),
    0 40px 70px rgba(0,0,0,0.35),
    0 0 45px rgba(255,196,70,0.25);
}

.machine{

    height:760px;

    overflow:hidden;

    border-radius:64px;

    position:relative;

    background:
    linear-gradient(
    to bottom,
    #643b1c,
    #2e1407);

    box-shadow:
    inset 0 0 45px rgba(0,0,0,0.8);
}

.machine::before{

    content:"";

    position:absolute;
    inset:0;

    border-radius:64px;

    background:
    radial-gradient(circle at center,
    rgba(255,180,60,0.18) 0%,
    transparent 45%);

    pointer-events:none;
}

#spinnerTrack{

    transition:transform 6s cubic-bezier(.12,.89,.16,1);

    padding:40px 20px;
}

.card{

    height:125px;

    margin-bottom:14px;

    border-radius:30px;

    background:
    linear-gradient(
    to bottom,
    #fff7e6,
    #edd9b5);

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:'Cormorant Garamond',serif;

    font-size:48px;
    font-weight:700;

    color:#5b3c22;

    position:relative;

    box-shadow:
    inset 0 0 0 3px #ead0a5,
    inset 0 10px 20px rgba(255,255,255,0.35),
    0 10px 20px rgba(0,0,0,0.22);
}

.card::before,
.card::after{

    content:"✦";

    position:absolute;

    color:#c8a97c;

    font-size:34px;
}

.card::before{
    left:22px;
}

.card::after{
    right:22px;
}

.center-highlight{

    position:absolute;

    left:16px;
    right:16px;

    top:50%;

    transform:translateY(-50%);

    height:125px;

    border-radius:30px;

    border:5px solid #ffd76b;

    box-shadow:
    0 0 18px rgba(255,215,90,0.95),
    0 0 60px rgba(255,190,40,0.55),
    inset 0 0 25px rgba(255,240,180,0.65);

    pointer-events:none;
}

/* ARROWS */

.arrow{

    position:absolute;

    top:50%;

    transform:
    translateY(-50%)
    rotate(45deg);

    width:56px;
    height:56px;

    z-index:20;

    background:
    linear-gradient(
    145deg,
    #ffd66b,
    #c88619,
    #7a4607);

    border:
    4px solid #f6d57a;

    box-shadow:
    0 0 18px rgba(255,210,90,0.7);
}

.left-arrow{
    left:-22px;
}

.right-arrow{
    right:-22px;
}

/* TABLE */

.table{

    width:760px;
    height:180px;

    margin:auto;
    margin-top:-40px;

    border-radius:40px 40px 120px 120px;

    background:
    linear-gradient(
    to bottom,
    #9a6233,
    #5a3418);

    box-shadow:
    inset 0 10px 18px rgba(255,255,255,0.15),
    inset 0 -15px 20px rgba(0,0,0,0.35),
    0 18px 40px rgba(0,0,0,0.3);
}

/* BUTTON */

.spin-btn{

    margin-top:-70px;

    border:none;

    border-radius:999px;

    padding:28px 130px;

    background:
    linear-gradient(
    to bottom,
    #5f9f44 0%,
    #2f6625 52%,
    #21491d 100%);

    color:#fff9df;

    font-family:'Cormorant Garamond',serif;

    font-size:72px;
    font-weight:700;

    letter-spacing:2px;

    cursor:pointer;

    position:relative;

    box-shadow:
    inset 0 4px 0 rgba(255,255,255,0.35),
    inset 0 -6px 0 rgba(0,0,0,0.35),
    0 14px 30px rgba(0,0,0,0.3),
    0 0 30px rgba(90,180,60,0.22);

    transition:0.18s;

    z-index:10;
}

.spin-btn:hover{
    transform:
    translateY(-4px)
    scale(1.03);
}

.spin-btn:active{
    transform:
    translateY(4px)
    scale(0.99);
}

#winnerText{

    margin-top:22px;

    font-size:46px;

    font-weight:900;

    color:#466638;
}

/* RIGHT SIDE */

.right-panel{

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:40px;
}

.sign{

    position:relative;

    width:230px;

    padding:36px 26px;

    border-radius:18px;

    background:
    linear-gradient(
    to bottom,
    #f7d39b,
    #d69a56);

    border:
    6px solid #73421d;

    color:#60381c;

    font-family:'Cormorant Garamond',serif;

    font-size:48px;

    line-height:1.05;

    text-align:center;

    box-shadow:
    inset 0 3px 8px rgba(255,255,255,0.35),
    inset 0 -8px 10px rgba(0,0,0,0.2),
    0 14px 24px rgba(0,0,0,0.2);

    transform:rotate(-3deg);
}

.sign::before,
.sign::after{

    content:"";

    position:absolute;

    top:-70px;

    width:5px;
    height:70px;

    background:#8a5a33;

    border-radius:999px;
}

.sign::before{
    left:42px;
}

.sign::after{
    right:42px;
}

.flowers{

    width:220px;
    height:260px;

    border-radius:28px;

    background:
    radial-gradient(circle at center,
    rgba(255,255,255,0.7),
    rgba(255,255,255,0));

    position:relative;
}

.flowers::before{

    content:"🌼 🌸 🌿";

    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:90px;

    filter:
    drop-shadow(0 8px 12px rgba(0,0,0,0.2));
}

/* MOBILE */

@media(max-width:1200px){

    .page{
        grid-template-columns:1fr;
    }

    .right-panel{
        display:none;
    }

    .machine-wrap{
        width:100%;
        max-width:520px;
    }

    .table{
        width:100%;
    }

    .title{
        font-size:64px;
    }
}

</style>
</head>
<body>

<div class="page">

    <!-- LEFT -->

    <div class="left-panel">

        <div class="panel-title">
            ❦ Your Restaurants ❦
        </div>

        <div class="add-row">
            <input id="restaurantInput" placeholder="Add new restaurant..." />
            <button onclick="addRestaurant()">Add</button>
        </div>

        <div id="restaurantList"></div>

    </div>

    <!-- CENTER -->

    <div class="center">

        <div class="title">
            🍽 Family Dinner Picker 🍽
        </div>

        <div class="subtitle">
            Spin the magical dinner wheel!
        </div>

        <div class="machine-wrap">

            <div class="arrow left-arrow"></div>
            <div class="arrow right-arrow"></div>

            <div class="machine-frame">

                <div class="machine">

                    <div class="center-highlight"></div>

                    <div id="spinnerTrack"></div>

                </div>

            </div>

        </div>

        <div class="table"></div>

        <button class="spin-btn" onclick="spinWheel()">
            SPIN
        </button>

        <div id="winnerText">
            ✨ Tonight: ??? ✨
        </div>

    </div>

    <!-- RIGHT -->

    <div class="right-panel">

        <div class="sign">
            Let's<br>
            have a<br>
            great<br>
            dinner!
        </div>

        <div class="flowers"></div>

    </div>

</div>

<script>

let restaurants = JSON.parse(localStorage.getItem("restaurants")) || [

    {name:"Olive Garden", crossed:false},
    {name:"Chick-fil-A", crossed:false},
    {name:"Texas Roadhouse", crossed:false},
    {name:"Panera Bread", crossed:false},
    {name:"Red Lobster", crossed:false},
    {name:"Outback Steakhouse", crossed:false},
    {name:"Maggiano's", crossed:false}

];

const listEl = document.getElementById("restaurantList");
const spinnerTrack = document.getElementById("spinnerTrack");

function saveData(){
    localStorage.setItem("restaurants", JSON.stringify(restaurants));
}

function renderRestaurants(){

    listEl.innerHTML = "";

    restaurants.forEach((r,index)=>{

        const item = document.createElement("div");

        item.className = "restaurant-item";

        item.innerHTML = `
            <div class="restaurant-name"
            style="${r.crossed ? 'opacity:0.4;text-decoration:line-through;' : ''}">
                ${r.name}
            </div>

            <div class="item-buttons">

                <button class="cross-btn"
                onclick="toggleCross(${index})">
                    ${r.crossed ? 'Undo' : 'Cross Off'}
                </button>

                <button class="delete-btn"
                onclick="deleteRestaurant(${index})">
                    🗑
                </button>

            </div>
        `;

        listEl.appendChild(item);

    });

    renderSpinner();

    saveData();
}

function renderSpinner(){

    spinnerTrack.innerHTML = "";

    const active = restaurants.filter(r => !r.crossed);

    if(active.length === 0) return;

    const repeated = [];

    for(let i = 0; i < 300; i++){
        repeated.push(...active);
    }

    repeated.forEach(r => {

        const card = document.createElement("div");

        card.className = "card";

        card.textContent = r.name;

        spinnerTrack.appendChild(card);

    });
}

let currentOffset = 5000;

function addRestaurant(){

    const input = document.getElementById("restaurantInput");

    const value = input.value.trim();

    if(!value) return;

    restaurants.push({
        name:value,
        crossed:false
    });

    input.value = "";

    renderRestaurants();
}

function toggleCross(index){

    restaurants[index].crossed =
    !restaurants[index].crossed;

    renderRestaurants();
}

function deleteRestaurant(index){

    restaurants.splice(index,1);

    renderRestaurants();
}

function spinWheel(){

    const active = restaurants.filter(r => !r.crossed);

    if(active.length === 0){
        alert("Add restaurants first");
        return;
    }

    document.getElementById("winnerText")
    .innerHTML =
    `✨ Tonight: ??? ✨`;

    const winnerIndex =
    Math.floor(Math.random() * active.length);

    const winner = active[winnerIndex];

    const cardHeight = 139;

    const loopHeight =
    active.length * cardHeight;

    const machine =
    document.querySelector(".machine");

    const machineHeight =
    machine.offsetHeight;

    const trackHeight =
    spinnerTrack.scrollHeight;

    const visibleBottom =
    currentOffset + machineHeight;

    if(visibleBottom > trackHeight - machineHeight){

        currentOffset -= loopHeight * 50;

        spinnerTrack.style.transition = "none";

        spinnerTrack.style.transform =
        `translateY(-${currentOffset}px)`;

        spinnerTrack.offsetHeight;
    }

    const currentIndex =
    Math.round(currentOffset / cardHeight);

    const spinsForward =
    (Math.floor(Math.random() * 10) + 18)
    * active.length;

    const currentLoopIndex =
    currentIndex % active.length;

    let moveToWinner =
    winnerIndex - currentLoopIndex;

    if(moveToWinner < 0){
        moveToWinner += active.length;
    }

    const targetIndex =
    currentIndex +
    spinsForward +
    moveToWinner;

    const centerOffset = 275;

    currentOffset =
    (targetIndex * cardHeight)
    - centerOffset;

    spinnerTrack.style.transition =
    "transform 6s cubic-bezier(.12,.89,.16,1)";

    spinnerTrack.style.transform =
    `translateY(-${currentOffset}px)`;

    setTimeout(() => {

        document.getElementById("winnerText")
        .innerHTML =
        `✨ Tonight: ${winner.name} ✨`;

    }, 6000);
}

renderRestaurants();

</script>

</body>
</html>
