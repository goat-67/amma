<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Family Dinner Picker</title>

<style>
    /* ========================================================= */
/* MISSING LAYOUT CLASSES                                    */
/* ========================================================= */

.page{
    width:100%;
    max-width:1500px;
    margin:0 auto;
    padding:24px 26px 120px;
    display:grid;
    grid-template-columns:300px 1fr 240px;
    gap:34px;
    align-items:start;
    position:relative;
    z-index:2;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:relative;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.58),
            rgba(255,255,255,0.28)
        );
    border-radius:36px;
    padding:22px;
    border:2px solid rgba(210,185,135,0.28);

    box-shadow:
        inset 0 2px 2px rgba(255,255,255,0.9),
        0 14px 32px rgba(96,64,28,0.10);

    backdrop-filter:blur(8px);
    overflow:hidden;
}

.sidebar::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.08),
            transparent 40%
        );

    pointer-events:none;
}

.sidebar-title{
    text-align:center;
    font-size:46px;
    line-height:1;
    color:#70895d;
    margin-bottom:24px;
    font-family:"Cormorant Garamond", serif;
    font-weight:700;

    text-shadow:
        0 2px 0 rgba(255,255,255,0.55);
}

/* ================= CENTER ================= */

.center{
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

/* ================= TITLE ================= */

.hero-title{
    font-size:86px;
    line-height:0.88;
    text-align:center;
    color:#356028;
    font-family:"Cormorant Garamond", serif;
    font-weight:700;
    margin-top:6px;
    margin-bottom:12px;

    text-shadow:
        0 2px 0 rgba(255,255,255,0.4),
        0 8px 18px rgba(62,94,38,0.08);
}

.hero-subtitle{
    font-size:20px;
    text-align:center;
    color:#7d624e;
    margin-bottom:28px;
    max-width:700px;
}

/* ================= MACHINE ================= */

.machine-wrap{
    position:relative;
    width:420px;
    height:690px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* OUTER WOOD FRAME */

.machine-frame{
    width:100%;
    height:560px;
    border-radius:52px;
    padding:16px;
    position:relative;

    background:
        linear-gradient(
            145deg,
            #cb9849 0%,
            #82441c 22%,
            #3e1c0d 58%,
            #8f5627 100%
        );

    box-shadow:
        inset 0 2px 5px rgba(255,255,255,0.26),
        inset 0 -12px 20px rgba(0,0,0,0.34),
        0 28px 50px rgba(70,38,14,0.24),
        0 0 30px rgba(255,208,100,0.10);

    position:relative;
}

.machine-frame::before{
    content:"";
    position:absolute;
    inset:12px;
    border-radius:40px;

    border:2px solid rgba(255,222,160,0.18);

    pointer-events:none;
}

.machine-frame::after{
    content:"";
    position:absolute;

    left:50%;
    transform:translateX(-50%);

    top:16px;

    width:65%;
    height:20px;

    border-radius:999px;

    background:rgba(255,255,255,0.15);

    filter:blur(5px);
}

/* INNER SLOT */

.machine{
    width:100%;
    height:100%;
    overflow:hidden;
    border-radius:38px;
    position:relative;

    background:
        linear-gradient(
            180deg,
            rgba(33,13,5,0.96),
            rgba(88,41,13,0.96)
        );

    box-shadow:
        inset 0 16px 26px rgba(0,0,0,0.45),
        inset 0 -12px 20px rgba(255,198,110,0.08);
}

.machine::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.05),
            transparent 20%,
            transparent 80%,
            rgba(0,0,0,0.22)
        );

    z-index:2;
    pointer-events:none;
}

/* ================= RIGHT SIDE ================= */

.right-side{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
}

/* ================= SIGN ================= */

.sign{
    width:190px;

    padding:30px 18px;

    border-radius:28px;

    background:
        linear-gradient(
            180deg,
            #f8ead0 0%,
            #ecd6b4 100%
        );

    border:6px solid #bf8649;

    box-shadow:
        inset 0 3px 3px rgba(255,255,255,0.55),
        0 12px 24px rgba(0,0,0,0.08);

    text-align:center;

    font-size:28px;
    line-height:1.35;

    color:#8a5e42;

    font-family:"Cormorant Garamond", serif;
}

/* ================= FLOWERS ================= */

.flowers{
    font-size:140px;

    filter:
        drop-shadow(0 8px 12px rgba(0,0,0,0.12));

    opacity:0.95;
}

/* ================= FOOTER ================= */

.footer{
    position:fixed;

    left:28px;
    right:28px;
    bottom:18px;

    height:72px;

    border-radius:999px;

    background:
        linear-gradient(
            180deg,
            rgba(240,227,195,0.96),
            rgba(228,212,177,0.96)
        );

    border:2px solid rgba(190,166,116,0.40);

    display:flex;
    align-items:center;
    justify-content:space-around;

    box-shadow:
        inset 0 2px 2px rgba(255,255,255,0.65),
        0 10px 20px rgba(0,0,0,0.08);

    backdrop-filter:blur(10px);

    z-index:999;
}

.footer-item{
    font-size:16px;
    font-weight:700;
    color:#7a5c44;

    display:flex;
    align-items:center;
    gap:10px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1350px){

    .page{
        grid-template-columns:280px 1fr;
    }

    .right-side{
        display:none;
    }
}

@media(max-width:980px){

    .page{
        grid-template-columns:1fr;
    }

    .sidebar{
        order:2;
    }

    .center{
        order:1;
    }

    .hero-title{
        font-size:62px;
    }
}

@media(max-width:640px){

    .hero-title{
        font-size:48px;
    }

    .machine-wrap{
        width:320px;
        height:560px;
    }

    .machine-frame{
        height:450px;
    }

    .footer{
        height:auto;
        padding:18px;
        flex-direction:column;
        gap:10px;
        border-radius:30px;
    }
}

<body>

<div class="app-shell">

    <!-- LEFT PANEL -->

    <aside class="left-panel glass-soft paper-noise fade-in">

        <div class="corner-leaf one"></div>

        <div class="left-title">
            ❦ Your <span>Restaurants</span> ❦
        </div>

        <div class="restaurant-input-wrap">

            <input
            id="restaurantInput"
            class="restaurant-input"
            placeholder="Add new restaurant...">

            <button
            class="add-btn"
            onclick="addRestaurant()">
                Add
            </button>

        </div>

        <div class="paper-divider"></div>

        <div
        id="restaurantList"
        class="restaurant-list"></div>

    </aside>

    <!-- CENTER PANEL -->

    <main class="center-panel fade-in">

        <div class="decor-glow left"></div>
        <div class="decor-glow right"></div>

        <div class="main-title">
            🍽 Family Dinner<br>
            <strong>Picker</strong> 🍽
        </div>

        <div class="subtitle">
            Pick tonight's restaurant with a Hearthstone-style spin!
        </div>

        <div class="wheel-area">

            <div class="wheel-glow"></div>

            <div class="side-arrow left"></div>

            <div class="side-arrow right"></div>

            <div class="wheel-shell">

                <div class="shine"></div>

                <div class="slot-window">

                    <div class="slot-highlight"></div>

                    <div
                    id="track"
                    class="slot-reel"></div>

                </div>

            </div>

            <button
            class="spin-btn"
            onclick="spinWheel()">
                SPIN
            </button>

            <div
            id="winnerText"
            class="spin-note"></div>

        </div>

    </main>

    <!-- RIGHT PANEL -->

    <aside class="right-panel fade-in">

        <div class="quote-sign paper-noise">
            Let's<br>
            have a<br>
            great<br>
            dinner!
        </div>

        <div class="flower-area">

            <div class="flower-vase"></div>

        </div>

        <div class="table-corner"></div>

        <div class="lace-cloth"></div>

    </aside>

</div>

<!-- FOOTER -->

<div class="footer-bar glass-soft">

    <div class="footer-tip">
        💡 Cross off places you don't want
    </div>

    <div class="footer-divider"></div>

    <div class="footer-tip">
        💾 Uses local storage automatically
    </div>

    <div class="footer-divider"></div>

    <div class="footer-tip">
        🔒 Private to this device
    </div>

</div>

<div class="soft-vignette"></div>

<script>

let restaurants =
JSON.parse(localStorage.getItem("restaurants"))
|| [

{name:"Olive Garden",crossed:false},
{name:"Chick-fil-A",crossed:false},
{name:"Texas Roadhouse",crossed:false},
{name:"Panera Bread",crossed:false},
{name:"Red Lobster",crossed:false},
{name:"Outback Steakhouse",crossed:false},
{name:"Maggiano's",crossed:false}

];

const list =
document.getElementById("restaurantList");

const track =
document.getElementById("track");

let spinning = false;

/* =========================
   SAVE
========================= */

function save(){

    localStorage.setItem(
        "restaurants",
        JSON.stringify(restaurants)
    );

}

/* =========================
   RENDER
========================= */

function render(){

    list.innerHTML = "";

    restaurants.forEach((r,index)=>{

        const card =
        document.createElement("div");

        card.className =
        `restaurant-card fade-in ${r.crossed ? 'crossed' : ''}`;

        card.innerHTML = `

            <div class="restaurant-name">
                ${r.name}
            </div>

            <div class="restaurant-actions">

                <button class="cross-btn"
                onclick="toggleCross(${index})">

                    ${r.crossed ? 'Undo' : 'Cross Off'}

                </button>

                <button class="delete-btn"
                onclick="deleteRestaurant(${index})">

                    🗑

                </button>

            </div>

        `;

        list.appendChild(card);

    });

    renderWheel();

    save();

}

/* =========================
   ADD
========================= */

function addRestaurant(){

    const input =
    document.getElementById("restaurantInput");

    const value =
    input.value.trim();

    if(!value) return;

    restaurants.push({

        name:value,
        crossed:false

    });

    input.value = "";

    render();

}

/* =========================
   DELETE
========================= */

function deleteRestaurant(index){

    restaurants.splice(index,1);

    render();

}

/* =========================
   CROSS OFF
========================= */

function toggleCross(index){

    restaurants[index].crossed =
    !restaurants[index].crossed;

    render();

}

/* =========================
   WHEEL RENDER
========================= */

function renderWheel(){

    track.innerHTML = "";

    const active =
    restaurants.filter(r => !r.crossed);

    if(active.length === 0){

        const empty =
        document.createElement("div");

        empty.className =
        "slot-card active";

        empty.innerHTML =
        `<span>Add Restaurants</span>`;

        track.appendChild(empty);

        return;

    }

    const repeated = [

        ...active,
        ...active,
        ...active,
        ...active,
        ...active

    ];

    repeated.forEach((r)=>{

        const card =
        document.createElement("div");

        card.className =
        "slot-card fade-in";

        if(r.name.length > 18){

            card.classList.add("small-text");

        }

        if(r.name.length > 26){

            card.classList.add("tiny-text");

        }

        card.innerHTML = `
            <span>${r.name}</span>
        `;

        track.appendChild(card);

    });

}

/* =========================
   SPIN
========================= */

function spinWheel(){

    if(spinning) return;

    const active =
    restaurants.filter(r => !r.crossed);

    if(active.length === 0){

        alert("Add restaurants first");

        return;

    }

    spinning = true;

    const button =
    document.querySelector(".spin-btn");

    button.classList.add("disabled");

    const winnerIndex =
    Math.floor(Math.random() * active.length);

    const winner =
    active[winnerIndex];

    const cardHeight = 150;

    const loops =
    active.length * 3;

    const finalIndex =
    loops + winnerIndex;

    const offset =
    (finalIndex * cardHeight) - 190;

    track.style.transition =
    "transform 5.8s cubic-bezier(.08,.72,.18,1)";

    track.style.transform =
    `translateY(-${offset}px)`;

    setTimeout(()=>{

        document.getElementById("winnerText")
        .innerHTML =
        `✨ Tonight: ${winner.name} ✨`;

        button.classList.remove("disabled");

        spinning = false;

    },5900);

}

/* =========================
   ENTER KEY
========================= */

document
.getElementById("restaurantInput")
.addEventListener("keydown",(e)=>{

    if(e.key === "Enter"){

        addRestaurant();

    }

});

/* =========================
   INITIALIZE
========================= */

render();

</script>
