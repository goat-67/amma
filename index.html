<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Family Dinner Picker</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
    radial-gradient(circle at top,#fff8ea 0%,#f6eddc 40%,#efe3cd 100%);
    min-height:100vh;
    overflow-x:hidden;
    font-family:'Nunito',sans-serif;
    color:#5a4635;
}

/* BACKGROUND DECOR */

.bg-glow{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
    radial-gradient(circle at center,
    rgba(255,221,120,0.18) 0%,
    transparent 35%);
}

/* MAIN LAYOUT */

.page{
    width:100%;
    min-height:100vh;
    display:grid;
    grid-template-columns:340px 1fr 260px;
    gap:40px;
    padding:30px;
}

/* LEFT PANEL */

.left-panel{
    background:#fff8ec;
    border-radius:32px;
    padding:25px;
    box-shadow:
    0 15px 40px rgba(0,0,0,0.08),
    inset 0 0 0 2px #ebddc4;
    position:relative;
}

.left-panel::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:32px;
    background:
    linear-gradient(to bottom,
    rgba(255,255,255,0.7),
    transparent 30%);
    pointer-events:none;
}

.panel-title{
    font-family:'Cormorant Garamond',serif;
    font-size:46px;
    color:#49693c;
    text-align:center;
    font-weight:700;
    margin-bottom:25px;
}

.add-row{
    display:flex;
    gap:12px;
    margin-bottom:25px;
}

.add-row input{
    flex:1;
    border:none;
    border-radius:18px;
    padding:18px;
    background:#f2e6d3;
    font-size:17px;
    outline:none;
    color:#5a4635;
}

/* UPDATED BUTTON FIX */

.add-row button{

    width:92px;
    min-width:92px;
    flex-shrink:0;

    border:none;

    background:
    linear-gradient(to bottom,#8ead73,#6d8f58);

    color:white;

    border-radius:18px;

    font-size:18px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.3),
    0 6px 12px rgba(0,0,0,0.12);
}

/* RESTAURANT ITEMS */

.restaurant-item{
    background:#fffdf7;
    border-radius:22px;
    padding:18px;
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:
    0 5px 14px rgba(0,0,0,0.06),
    inset 0 0 0 2px #eee0c7;
}

.restaurant-name{
    font-size:22px;
    font-weight:800;
    max-width:150px;
    overflow-wrap:break-word;
}

.item-buttons{
    display:flex;
    gap:8px;
}

.item-buttons button{
    border:none;
    border-radius:14px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:800;
    font-size:14px;
}

.cross-btn{
    background:#7d9d63;
    color:white;
}

.delete-btn{
    background:#f5d9d0;
    color:#9b5f51;
}

/* CENTER */

.center{
    text-align:center;
    position:relative;
}

.title{
    font-family:'Cormorant Garamond',serif;
    font-size:92px;
    line-height:0.95;
    color:#355a2d;
    font-weight:700;
    margin-top:10px;
}

.subtitle{
    font-size:34px;
    margin-top:15px;
    color:#6b5647;
}

/* MACHINE */

.machine-wrap{
    margin:auto;
    margin-top:35px;
    width:470px;
    position:relative;
}

/* GOLD GLOW */

.machine-wrap::before{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:760px;
    height:760px;
    background:
    radial-gradient(circle,
    rgba(255,211,92,0.35) 0%,
    rgba(255,211,92,0.12) 25%,
    transparent 60%);
    pointer-events:none;
}

/* OUTER FRAME */

.machine-frame{
    position:relative;
    padding:18px;

    border-radius:70px;

    background:
    linear-gradient(to bottom,
    #d7a14d 0%,
    #7a4d1f 20%,
    #4d2d14 50%,
    #9f6a2b 80%,
    #d8a14d 100%);

    box-shadow:
    inset 0 0 20px rgba(255,255,255,0.3),
    inset 0 -10px 30px rgba(0,0,0,0.5),
    0 25px 50px rgba(0,0,0,0.25);
}

/* INNER MACHINE */

.machine{
    height:760px;
    overflow:hidden;
    border-radius:58px;
    position:relative;

    background:
    linear-gradient(to bottom,
    #6a4423 0%,
    #412310 100%);

    box-shadow:
    inset 0 0 40px rgba(0,0,0,0.8);
}

/* TRACK */

#spinnerTrack{
    transition:transform 6s cubic-bezier(.12,.89,.16,1);
    padding:40px 20px;
}

/* CARDS */

.card{
    height:125px;

    margin-bottom:14px;

    border-radius:28px;

    background:
    linear-gradient(to bottom,
    #fff7e6 0%,
    #f0dcc0 100%);

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:'Cormorant Garamond',serif;
    font-size:48px;
    font-weight:700;

    color:#5a3d24;

    box-shadow:
    inset 0 0 0 3px #ecd8b3,
    0 10px 20px rgba(0,0,0,0.18);

    position:relative;
}

.card::before{
    content:"✦";
    position:absolute;
    left:18px;
    opacity:0.35;
}

.card::after{
    content:"✦";
    position:absolute;
    right:18px;
    opacity:0.35;
}

/* WINNER CENTER */

.center-highlight{
    position:absolute;
    left:20px;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    height:125px;

    border-radius:28px;

    border:4px solid #ffdb6c;

    box-shadow:
    0 0 25px rgba(255,220,110,0.8),
    inset 0 0 20px rgba(255,240,180,0.5);

    pointer-events:none;
}

/* ARROWS */

.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:10;
    width:0;
    height:0;
}

.left-arrow{
    left:-34px;
    border-top:28px solid transparent;
    border-bottom:28px solid transparent;
    border-right:40px solid #d9a638;
}

.right-arrow{
    right:-34px;
    border-top:28px solid transparent;
    border-bottom:28px solid transparent;
    border-left:40px solid #d9a638;
}

/* SPIN BUTTON */

.spin-btn{
    margin-top:30px;

    border:none;

    border-radius:999px;

    padding:26px 110px;

    background:
    linear-gradient(to bottom,
    #4d7d3c 0%,
    #2d5c2a 100%);

    color:white;

    font-family:'Cormorant Garamond',serif;
    font-size:64px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
    inset 0 4px 0 rgba(255,255,255,0.3),
    0 12px 30px rgba(0,0,0,0.22);

    transition:0.2s;
}

.spin-btn:hover{
    transform:translateY(-3px) scale(1.02);
}

#winnerText{
    margin-top:24px;
    font-size:42px;
    font-weight:900;
    color:#49693c;
}

/* RIGHT SIDE */

.right-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:40px;
}

.sign{
    background:#f6e4c9;
    border:5px solid #bc8752;
    border-radius:24px;
    padding:35px;
    width:220px;

    text-align:center;

    font-family:'Cormorant Garamond',serif;
    font-size:46px;
    line-height:1.1;

    color:#7c5436;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.1);
}

.flowers{
    font-size:180px;
    opacity:0.7;
}

/* MOBILE */

@media(max-width:1200px){

    .page{
        grid-template-columns:1fr;
    }

    .right-panel{
        display:none;
    }

    .left-panel{
        order:2;
    }

    .center{
        order:1;
    }

    .machine-wrap{
        width:100%;
        max-width:470px;
    }

    .title{
        font-size:62px;
    }
}

</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="page">

    <!-- LEFT -->

    <div class="left-panel">

        <div class="panel-title">
            ❦ Your Restaurants ❦
        </div>

        <div class="add-row">
            <input id="restaurantInput" placeholder="Add new restaurant..." />
            <button onclick="addRestaurant()">Add</button>
        </div>

        <div id="restaurantList"></div>

    </div>

    <!-- CENTER -->

    <div class="center">

        <div class="title">
            🍽 Family Dinner Picker 🍽
        </div>

        <div class="subtitle">
            Pick tonight's restaurant with a Hearthstone-style spin!
        </div>

        <div class="machine-wrap">

            <div class="arrow left-arrow"></div>
            <div class="arrow right-arrow"></div>

            <div class="machine-frame">

                <div class="machine">

                    <div class="center-highlight"></div>

                    <div id="spinnerTrack"></div>

                </div>

            </div>

        </div>

        <button class="spin-btn" onclick="spinWheel()">
            SPIN
        </button>

        <div id="winnerText"></div>

    </div>

    <!-- RIGHT -->

    <div class="right-panel">

        <div class="sign">
            Let's<br>
            have a<br>
            great<br>
            dinner!
        </div>

        <div class="flowers">
            🌸
        </div>

    </div>

</div>

<script>

let restaurants = JSON.parse(localStorage.getItem("restaurants")) || [

    {name:"Olive Garden", crossed:false},
    {name:"Chick-fil-A", crossed:false},
    {name:"Texas Roadhouse", crossed:false},
    {name:"Panera Bread", crossed:false},
    {name:"Red Lobster", crossed:false},
    {name:"Outback Steakhouse", crossed:false},
    {name:"Maggiano's", crossed:false}

];

const listEl = document.getElementById("restaurantList");
const spinnerTrack = document.getElementById("spinnerTrack");

function saveData(){
    localStorage.setItem("restaurants", JSON.stringify(restaurants));
}

function renderRestaurants(){

    listEl.innerHTML = "";

    restaurants.forEach((r,index)=>{

        const item = document.createElement("div");

        item.className = "restaurant-item";

        item.innerHTML = `
            <div class="restaurant-name"
            style="${r.crossed ? 'opacity:0.4;text-decoration:line-through;' : ''}">
                ${r.name}
            </div>

            <div class="item-buttons">

                <button class="cross-btn"
                onclick="toggleCross(${index})">
                    ${r.crossed ? 'Undo' : 'Cross Off'}
                </button>

                <button class="delete-btn"
                onclick="deleteRestaurant(${index})">
                    🗑
                </button>

            </div>
        `;

        listEl.appendChild(item);

    });

    renderSpinner();

    saveData();
}


function renderSpinner(){

    spinnerTrack.innerHTML = "";

    const active = restaurants.filter(r => !r.crossed);

    if(active.length === 0) return;

    // HUGE repeated list so it never hits blank space
    const repeated = [];

    for(let i = 0; i < 30; i++){
        repeated.push(...active);
    }

    repeated.forEach(r => {

        const card = document.createElement("div");

        card.className = "card";

        card.textContent = r.name;

        spinnerTrack.appendChild(card);

    });

}

let currentOffset = 0;

function addRestaurant(){

    const input = document.getElementById("restaurantInput");

    const value = input.value.trim();

    if(!value) return;

    restaurants.push({
        name:value,
        crossed:false
    });

    input.value = "";

    renderRestaurants();
}

function toggleCross(index){

    restaurants[index].crossed =
    !restaurants[index].crossed;

    renderRestaurants();
}

function deleteRestaurant(index){

    restaurants.splice(index,1);

    renderRestaurants();
}

function spinWheel(){

    const active = restaurants.filter(r => !r.crossed);

    if(active.length === 0){
        alert("Add restaurants first");
        return;
    }

    const winnerIndex =
    Math.floor(Math.random() * active.length);

    const winner = active[winnerIndex];

    const cardHeight = 139;

    // always continue downward
    const extraSpins =
    (Math.floor(Math.random() * 10) + 18) * active.length;

    const moveAmount =
    (extraSpins + winnerIndex) * cardHeight;

    currentOffset += moveAmount;

// loop the wheel forever without empty space
const resetPoint =
(active.length * 139 * 20);

if(currentOffset > resetPoint){

    currentOffset =
    active.length * 139 * 10;

    spinnerTrack.style.transition = "none";

    spinnerTrack.style.transform =
    `translateY(-${currentOffset}px)`;

    spinnerTrack.offsetHeight;

    spinnerTrack.style.transition =
    "transform 6s cubic-bezier(.12,.89,.16,1)";
}

    spinnerTrack.style.transition =
    "transform 6s cubic-bezier(.12,.89,.16,1)";

    spinnerTrack.style.transform =
    `translateY(-${currentOffset}px)`;

    document.getElementById("winnerText")
    .innerHTML =
    `✨ Tonight: ${winner.name} ✨`;

}

renderRestaurants();

</script>

</body>
</html>
