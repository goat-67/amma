<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinematic Family Dinner Picker</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;

    font-family:'Nunito',sans-serif;

    background:
    radial-gradient(circle at center,
    rgba(255,221,155,0.16) 0%,
    rgba(255,221,155,0.08) 18%,
    transparent 40%),

    radial-gradient(circle at top,
    #fff8e7 0%,
    #f4e5c8 30%,
    #ead7b3 60%,
    #d9c19a 100%);

    color:#5b3e27;

    position:relative;
}

/* =========================================================
   WALL TEXTURE
========================================================= */

body::before{
    content:"";

    position:fixed;
    inset:0;

    background:

    repeating-linear-gradient(
    90deg,
    rgba(255,255,255,0.025) 0px,
    rgba(255,255,255,0.025) 2px,
    transparent 2px,
    transparent 6px),

    repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.015) 0px,
    rgba(0,0,0,0.015) 2px,
    transparent 2px,
    transparent 5px);

    opacity:.45;

    pointer-events:none;

    z-index:0;
}

/* =========================================================
   CINEMATIC VIGNETTE
========================================================= */

body::after{
    content:"";

    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at center,
    transparent 40%,
    rgba(0,0,0,0.22) 100%);

    pointer-events:none;

    z-index:0;
}

/* =========================================================
   ROOM GLOW
========================================================= */

.room-light{

    position:fixed;

    left:50%;
    top:-200px;

    transform:translateX(-50%);

    width:1200px;
    height:900px;

    background:
    radial-gradient(circle,
    rgba(255,231,160,0.42) 0%,
    rgba(255,218,120,0.16) 35%,
    transparent 72%);

    pointer-events:none;

    filter:blur(10px);

    z-index:1;
}

/* =========================================================
   MAIN ROOM
========================================================= */

.room{

    position:relative;

    width:100%;
    min-height:100vh;

    z-index:2;

    overflow:hidden;
}

/* =========================================================
   CEILING SHADOW
========================================================= */

.ceiling-shadow{

    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:160px;

    background:
    linear-gradient(to bottom,
    rgba(0,0,0,0.18),
    transparent);

    z-index:2;
}

/* =========================================================
   SHELF
========================================================= */

.shelf{

    position:absolute;

    left:70px;
    top:55px;

    width:340px;
    height:22px;

    border-radius:8px;

    background:
    linear-gradient(to bottom,

    inset 0 3px 2px rgba(255,255,255,0.2),
    inset 0 -4px 4px rgba(0,0,0,0.4);

    z-index:6;
}

.shelf::after{

    content:"";

    position:absolute;
    left:12px;
    right:12px;
    bottom:-16px;

    height:20px;

    background:
    radial-gradient(circle,
    rgba(0,0,0,0.28),
    transparent 70%);

    filter:blur(8px);
}

/* =========================================================
   SHELF ITEMS
========================================================= */

.shelf-item{
    position:absolute;
    bottom:18px;
}

.plant{

}

.plant::before{

.quote-frame{

.left-panel{

.left-panel::before{

.panel-title{

.restaurant-item{

/* =========================================================

.spinner-stage::before{

.machine-frame{

/* =========================================================

========================================================= */

.machine-frame::before{

    content:"";

.machine-frame::after{

    content:"";

    width:70px;

/* =========================================================
   INNER TUNNEL
========================================================= */

.machine{

    position:absolute;

    inset:24px;

    border-radius:70px;

    radial-gradient(circle at center,

.center-glow{

/* =========================================================

#spinnerTrack{

/* =========================================================
   CARDS
========================================================= */

.card{

    height:125px;

    margin-bottom:14px;

    display:flex;

    font-size:52px;

    color:#6a4527;

    linear-gradient(to bottom,
    #fffaf0 0%,
    #f5e6c9 40%,

    box-shadow:

    inset 0 3px 3px rgba(255,255,255,0.8),

}

.card::before{

    repeating-linear-gradient(

.arrow{

.spin-btn::before{

.spin-btn:hover{

    translateY(-4px)

/* =========================================================
   WINNER TEXT
========================================================= */

#winnerText{

}

/* =========================================================

.sign-wrap{

.sign-text{

/* =========================================================
   TABLE
========================================================= */

.table{

    position:absolute;

    left:0;
    right:0;
    bottom:-40px;

    height:240px;

    background:

    linear-gradient(to bottom,
    #8b552d 0%,
    #5f3519 60%,

.vase{

/* =========================================================

.flower{

.flower1{

.flower2{

.flower3{

</style>
</head>
<body>

<div class="room-light"></div>

<div class="room">

    <div class="ceiling-shadow"></div>

    <!-- SHELF -->

    <div class="shelf">

        <div class="shelf-item plant"></div>

        <div class="shelf-item quote-frame">
            Good<br>food<br>good<br>mood
        </div>

    </div>

    <!-- LEFT PANEL -->

    <div class="left-panel">

        <div class="panel-title">
            ❦ Your<br>Restaurants ❦
        </div>

        <div class="add-row">

            <input
            id="restaurantInput"
            placeholder="Add restaurant...">

            <button onclick="addRestaurant()">
                Add
            </button>

        </div>

        <div id="restaurantList"></div>

    </div>

    <!-- TITLE -->

    <div class="title-wrap">

        <div class="title">
            🍽 Family Dinner<br>Picker 🍽
        </div>

        <div class="subtitle">
            Spin the magical dinner machine!
        </div>

    </div>

    <!-- SPINNER -->

    <div class="spinner-stage">

        <div class="arrow left-arrow"></div>
        <div class="arrow right-arrow"></div>

        <div class="machine-frame">

            <div class="machine">

                <div class="center-glow"></div>

                <div id="spinnerTrack"></div>

            </div>

        </div>

        <button class="spin-btn" onclick="spinWheel()">
            SPIN
        </button>

        <div id="winnerText">
            ✨ Tonight: ??? ✨
        </div>

    </div>

    <!-- HANGING SIGN -->

    <div class="sign-wrap">

        <div class="chain left"></div>
        <div class="chain right"></div>

        <div class="sign">

            <div class="sign-text">
                Let's<br>
                have a<br>
                great<br>
                dinner!
            </div>

        </div>

    </div>

    <!-- TABLE -->

    <div class="table"></div>

    <!-- FLOWERS -->

    <div class="flower flower1"></div>
    <div class="flower flower2"></div>
    <div class="flower flower3"></div>

    <div class="vase"></div>

</div>

<script>

/* =========================================================
   DATA
========================================================= */

let restaurants =
JSON.parse(localStorage.getItem("restaurants")) || [

    {name:"Olive Garden",crossed:false},
    {name:"Texas Roadhouse",crossed:false},
    {name:"Chick-fil-A",crossed:false},
    {name:"Panera Bread",crossed:false},
    {name:"Outback",crossed:false},
    {name:"Red Lobster",crossed:false}

];

const listEl =
document.getElementById("restaurantList");

const spinnerTrack =
document.getElementById("spinnerTrack");

let currentOffset = 6000;

/* =========================================================
   SAVE
========================================================= */

function saveData(){

    localStorage.setItem(
    "restaurants",
    JSON.stringify(restaurants)
    );
}

/* =========================================================
   RENDER LIST
========================================================= */

function renderRestaurants(){

    listEl.innerHTML = "";

    restaurants.forEach((r,index)=>{

        const item =
        document.createElement("div");

        item.className =
        "restaurant-item";

        item.innerHTML = `

            <div class="restaurant-name"
            style="
            ${r.crossed
            ? 'opacity:.4;text-decoration:line-through;'
            : ''}">

                ${r.name}

            </div>

            <div class="item-buttons">

                <button
                class="cross-btn"
                onclick="toggleCross(${index})">

                    ${r.crossed ? 'Undo' : 'Cross Off'}

                </button>

                <button
                class="delete-btn"
                onclick="deleteRestaurant(${index})">

                    🗑

                </button>

            </div>
        `;

        listEl.appendChild(item);

    });

    renderSpinner();

    saveData();
}

/* =========================================================
   SPINNER
========================================================= */

function renderSpinner(){

    spinnerTrack.innerHTML = "";

    const active =
    restaurants.filter(r => !r.crossed);

    if(active.length === 0) return;

    const repeated = [];

    for(let i = 0; i < 400; i++){

        repeated.push(...active);
    }

    repeated.forEach(r=>{

        const card =
        document.createElement("div");

        card.className = "card";

        card.textContent = r.name;

        spinnerTrack.appendChild(card);
    });
}

/* =========================================================
   ADD
========================================================= */

function addRestaurant(){

    const input =
    document.getElementById(
    "restaurantInput"
    );

    const value =
    input.value.trim();

    if(!value) return;

    restaurants.push({

        name:value,
        crossed:false
    });

    input.value = "";

    renderRestaurants();
}

/* =========================================================
   TOGGLE
========================================================= */

function toggleCross(index){

    restaurants[index].crossed =
    !restaurants[index].crossed;

    renderRestaurants();
}

/* =========================================================
   DELETE
========================================================= */

function deleteRestaurant(index){

    restaurants.splice(index,1);

    renderRestaurants();
}
