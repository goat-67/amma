<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Family Dinner Picker</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:
    radial-gradient(circle at center,
    #fff8ea 0%,
    #f7ecd8 45%,
    #f0e1c6 100%);

    font-family:'Nunito',sans-serif;
    color:#5d4632;
    height:100vh;
}

/* ====== AMBIENT LIGHT ====== */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
    radial-gradient(circle at center,
    rgba(255,220,120,0.25) 0%,
    rgba(255,220,120,0.08) 20%,
    transparent 55%);
}

/* ====== PAGE ====== */

.page{
    height:100vh;
    display:grid;
    grid-template-columns:360px 1fr 270px;
    gap:40px;
    padding:20px 30px 95px;
}

/* ================= LEFT PANEL ================= */

.sidebar{

    background:
    linear-gradient(to bottom,
    rgba(255,255,255,0.72),
    rgba(255,248,236,0.96));

    border-radius:34px;

    padding:24px;

    position:relative;

    backdrop-filter:blur(8px);

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08),
    inset 0 0 0 2px #ead9b9,
    inset 0 4px 8px rgba(255,255,255,0.9);
}

.sidebar::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:34px;

    background:
    linear-gradient(to bottom,
    rgba(255,255,255,0.8),
    transparent 22%);

    pointer-events:none;
}

.sidebar-title{
    font-family:'Cormorant Garamond',serif;
    font-size:54px;
    line-height:0.95;
    color:#567147;
    text-align:center;
    font-weight:700;
    margin-top:8px;
    margin-bottom:28px;
}

/* INPUT */

.add-box{
    display:flex;
    gap:12px;
    margin-bottom:24px;
}

.add-box input{
    flex:1;
    border:none;
    outline:none;

    border-radius:18px;

    padding:18px;

    font-size:18px;

    background:
    linear-gradient(to bottom,
    #fffdf7,
    #f2e6d4);

    color:#654c36;

    box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.9),
    inset 0 -3px 5px rgba(0,0,0,0.05);
}

.add-box button{

    border:none;

    width:112px;

    border-radius:18px;

    background:
    linear-gradient(to bottom,
    #88a96e 0%,
    #5f834d 100%);

    color:white;

    font-size:20px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
    inset 0 3px 0 rgba(255,255,255,0.3),
    0 6px 16px rgba(0,0,0,0.18);
}

/* RESTAURANT CARDS */

.restaurant-card{

    background:
    linear-gradient(to bottom,
    #fffefb 0%,
    #f8efdf 100%);

    border-radius:24px;

    padding:18px;

    margin-bottom:15px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:relative;

    box-shadow:
    0 6px 14px rgba(0,0,0,0.05),
    inset 0 0 0 2px #ead9b7,
    inset 0 3px 5px rgba(255,255,255,0.85);
}

.restaurant-name{
    font-size:20px;
    font-weight:900;
    color:#5d4632;
    max-width:150px;
    overflow-wrap:break-word;
}

.card-buttons{
    display:flex;
    gap:8px;
}

.cross-btn,
.delete-btn{
    border:none;
    cursor:pointer;
    border-radius:14px;
    font-weight:900;
}

.cross-btn{
    background:
    linear-gradient(to bottom,
    #8caf71,
    #6f9157);

    color:white;
    padding:12px 15px;
}

.delete-btn{
    width:45px;
    background:
    linear-gradient(to bottom,
    #ffe5dd,
    #f2cfc6);

    color:#a16b5d;
}

/* ================= CENTER ================= */

.center{
    text-align:center;
    position:relative;
}

/* TITLE */

.hero-title{
    font-family:'Cormorant Garamond',serif;
    color:#315b2c;

    font-size:92px;
    line-height:0.88;

    font-weight:700;

    text-shadow:
    0 2px 0 rgba(255,255,255,0.6);
}

.hero-subtitle{
    margin-top:16px;

    font-size:33px;

    color:#705845;

    line-height:1.15;
}

/* ================= MACHINE ================= */

.machine-wrap{
    width:470px;
    margin:18px auto 0;
    position:relative;
}

/* MASSIVE GOLD GLOW */

.machine-wrap::before{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:850px;
    height:850px;

    background:
    radial-gradient(circle,
    rgba(255,220,100,0.35) 0%,
    rgba(255,220,100,0.08) 35%,
    transparent 65%);

    pointer-events:none;
}

/* GOLD FRAME */

.machine-frame{

    position:relative;

    padding:18px;

    border-radius:70px;

    background:
    linear-gradient(145deg,
    #f2c770 0%,
    #8d5720 16%,
    #4d2811 38%,
    #7a481a 60%,
    #e3b25c 100%);

    box-shadow:
    inset 0 0 20px rgba(255,255,255,0.35),
    inset 0 -15px 30px rgba(0,0,0,0.45),
    0 18px 45px rgba(0,0,0,0.22),
    0 0 60px rgba(255,200,90,0.25);
}

/* INNER MACHINE */

.machine{

    height:545px;

    overflow:hidden;

    border-radius:56px;

    position:relative;

    background:
    linear-gradient(to bottom,
    #603517 0%,
    #381b0d 100%);

    box-shadow:
    inset 0 0 40px rgba(0,0,0,0.7);
}

/* DARK EDGE SHADING */

.machine::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
    radial-gradient(circle at center,
    transparent 40%,
    rgba(0,0,0,0.32) 100%);
}

/* TRACK */

#track{
    padding:20px;
    transition:transform 5.8s cubic-bezier(.12,.89,.16,1);
}

/* CARDS */

.spin-card{

    height:132px;

    margin-bottom:13px;

    border-radius:28px;

    position:relative;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(to bottom,
    #fff8ea 0%,
    #ecd7b7 100%);

    box-shadow:
    inset 0 0 0 3px #efd9b1,
    inset 0 5px 8px rgba(255,255,255,0.9),
    inset 0 -8px 10px rgba(0,0,0,0.05),
    0 8px 18px rgba(0,0,0,0.14);

    font-family:'Cormorant Garamond',serif;

    font-size:34px;

    font-weight:700;

    color:#5f3d21;
}

/* ORNAMENTS */

.spin-card::before,
.spin-card::after{
    content:"✦";

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    font-size:42px;

    opacity:0.25;
}

.spin-card::before{
    left:22px;
}

.spin-card::after{
    right:22px;
}

/* WINNER AREA */

.winner-zone{
    position:absolute;

    left:18px;
    right:18px;

    top:50%;

    transform:translateY(-50%);

    height:132px;

    border-radius:30px;

    border:4px solid #ffd95b;

    box-shadow:
    0 0 20px rgba(255,220,100,0.9),
    inset 0 0 18px rgba(255,240,180,0.5);

    pointer-events:none;
}

/* ARROWS */

.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:20;
}

.left-arrow{
    left:-42px;
}

.right-arrow{
    right:-42px;
}

/* GOLD GEM ARROWS */

.arrow::before{

    content:"";

    display:block;

    width:0;
    height:0;
}

.left-arrow::before{

    border-top:28px solid transparent;
    border-bottom:28px solid transparent;
    border-right:42px solid #e0b043;

    filter:
    drop-shadow(0 0 10px rgba(255,220,100,0.8));
}

.right-arrow::before{

    border-top:28px solid transparent;
    border-bottom:28px solid transparent;
    border-left:42px solid #e0b043;

    filter:
    drop-shadow(0 0 10px rgba(255,220,100,0.8));
}

/* SPIN BUTTON */

.spin-btn{

    margin-top:22px;

    border:none;

    border-radius:999px;

    padding:22px 100px;

    cursor:pointer;

    position:relative;

    background:
    linear-gradient(to bottom,
    #4d7f3d 0%,
    #2e5828 100%);

    color:white;

    font-family:'Cormorant Garamond',serif;

    font-size:58px;

    font-weight:700;

    box-shadow:
    inset 0 3px 0 rgba(255,255,255,0.3),
    inset 0 -5px 8px rgba(0,0,0,0.2),
    0 12px 28px rgba(0,0,0,0.25);
}

.spin-btn:hover{
    transform:translateY(-2px) scale(1.02);
}

.spin-btn::before{
    content:"❦";
    position:absolute;
    left:30px;
    top:50%;
    transform:translateY(-50%);
    opacity:0.8;
}

.spin-btn::after{
    content:"❦";
    position:absolute;
    right:30px;
    top:50%;
    transform:translateY(-50%);
    opacity:0.8;
}

/* RESULT */

#winnerText{
    margin-top:18px;
    font-size:34px;
    font-weight:900;
    color:#4f713f;
}

/* ================= RIGHT SIDE ================= */

.right-side{
    position:relative;
}

/* HANGING SIGN */

.sign{

    width:220px;

    margin:auto;

    background:
    linear-gradient(to bottom,
    #f6e7cb,
    #ecd9b8);

    border-radius:28px;

    border:6px solid #c18a4f;

    padding:42px 22px;

    text-align:center;

    font-family:'Cormorant Garamond',serif;

    font-size:34px;

    color:#7a5234;

    line-height:1.08;

    box-shadow:
    0 10px 20px rgba(0,0,0,0.12),
    inset 0 3px 6px rgba(255,255,255,0.7);
}

/* FLOWERS */

.flowers{
    position:absolute;
    right:20px;
    bottom:0;
    font-size:170px;
    opacity:0.85;
}

/* ================= FOOTER ================= */

.footer{

    position:fixed;

    left:30px;
    right:30px;
    bottom:16px;

    background:
    rgba(239,229,197,0.92);

    backdrop-filter:blur(10px);

    border-radius:26px;

    display:flex;
    justify-content:space-around;

    padding:18px;

    box-shadow:
    0 8px 20px rgba(0,0,0,0.08),
    inset 0 0 0 2px #e0cfaa;
}

.footer-item{
    font-weight:800;
    color:#715948;
}

/* MOBILE */

@media(max-width:1400px){

    body{
        overflow:auto;
    }

    .page{
        grid-template-columns:1fr;
        height:auto;
    }

    .right-side{
        display:none;
    }

    .machine-wrap{
        width:100%;
        max-width:470px;
    }

    .hero-title{
        font-size:68px;
    }
}

</style>
</head>
<body>

<div class="page">

    <!-- LEFT -->

    <div class="sidebar">

        <div class="sidebar-title">
            ❦ Your<br>
            Restaurants ❦
        </div>

        <div class="add-box">

            <input id="restaurantInput"
            placeholder="Add new restaurant...">

            <button onclick="addRestaurant()">
                Add
            </button>

        </div>

        <div id="restaurantList"></div>

    </div>

    <!-- CENTER -->

    <div class="center">

        <div class="hero-title">
            🍽 Family Dinner<br>
            Picker 🍽
        </div>

        <div class="hero-subtitle">
            Pick tonight's restaurant with a Hearthstone-style spin!
        </div>

        <div class="machine-wrap">

            <div class="arrow left-arrow"></div>
            <div class="arrow right-arrow"></div>

            <div class="machine-frame">

                <div class="machine">

                    <div class="winner-zone"></div>

                    <div id="track"></div>

                </div>

            </div>

        </div>

        <button class="spin-btn"
        onclick="spinWheel()">
            SPIN
        </button>

        <div id="winnerText"></div>

    </div>

    <!-- RIGHT -->

    <div class="right-side">

        <div class="sign">
            Let's<br>
            have a<br>
            great<br>
            dinner!
        </div>

        <div class="flowers">
            🌸
        </div>

    </div>

</div>

<div class="footer">

    <div class="footer-item">
        💡 Cross off places you don't want
    </div>

    <div class="footer-item">
        💾 Uses local storage automatically
    </div>

    <div class="footer-item">
        🔒 Private to this device
    </div>

</div>

<script>

let restaurants =
JSON.parse(localStorage.getItem("restaurants"))
|| [

{name:"Olive Garden",crossed:false},
{name:"Chick-fil-A",crossed:false},
{name:"Texas Roadhouse",crossed:false},
{name:"Panera Bread",crossed:false},
{name:"Red Lobster",crossed:false},
{name:"Outback Steakhouse",crossed:false},
{name:"Maggiano's",crossed:false}

];

const list = document.getElementById("restaurantList");
const track = document.getElementById("track");

/* RENDER */

function render(){

    list.innerHTML = "";

    restaurants.forEach((r,index)=>{

        const card = document.createElement("div");

        card.className = "restaurant-card";

        card.innerHTML = `

            <div class="restaurant-name"
            style="${r.crossed ? 'opacity:.4;text-decoration:line-through;' : ''}">
                ${r.name}
            </div>

            <div class="card-buttons">

                <button class="cross-btn"
                onclick="toggleCross(${index})">

                    ${r.crossed ? 'Undo' : 'Cross Off'}

                </button>

                <button class="delete-btn"
                onclick="deleteRestaurant(${index})">

                    🗑

                </button>

            </div>
        `;

        list.appendChild(card);

    });

    renderWheel();

    save();
}

/* SAVE */

function save(){

    localStorage.setItem(
        "restaurants",
        JSON.stringify(restaurants)
    );
}

/* ADD */

function addRestaurant(){

    const input =
    document.getElementById("restaurantInput");

    const value = input.value.trim();

    if(!value) return;

    restaurants.push({
        name:value,
        crossed:false
    });

    input.value = "";

    render();
}

/* DELETE */

function deleteRestaurant(index){

    restaurants.splice(index,1);

    render();
}

/* CROSS OFF */

function toggleCross(index){

    restaurants[index].crossed =
    !restaurants[index].crossed;

    render();
}

/* WHEEL */

function renderWheel(){

    track.innerHTML = "";

    const active =
    restaurants.filter(r=>!r.crossed);

    const repeated = [
        ...active,
        ...active,
        ...active,
        ...active
    ];

    repeated.forEach(r=>{

        const div =
        document.createElement("div");

        div.className = "spin-card";

        div.innerText = r.name;

        track.appendChild(div);

    });
}

/* SPIN */

function spinWheel(){

    const active =
    restaurants.filter(r=>!r.crossed);

    if(active.length === 0){

        alert("Add restaurants first");

        return;
    }

    const winnerIndex =
    Math.floor(Math.random() * active.length);

    const winner =
    active[winnerIndex];

    const cardHeight = 145;

    const loops =
    active.length * 2;

    const finalIndex =
    loops + winnerIndex;

    const offset =
    (finalIndex * cardHeight) - 190;

    track.style.transition =
    "transform 5.8s cubic-bezier(.12,.89,.16,1)";

    track.style.transform =
    `translateY(-${offset}px)`;

    document.getElementById("winnerText")
    .innerHTML =
    `✨ Tonight: ${winner.name} ✨`;
}

render();

</script>

</body>
</html>
