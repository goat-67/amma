<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinematic Family Dinner Picker</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

/* =========================================================
   WORLD
========================================================= */

body{

    font-family:'Inter',sans-serif;

    background:
    radial-gradient(circle at center,
    #6e4d2e 0%,
    #3b2416 35%,
    #1b120d 100%);

    position:relative;

    color:#f5e7c7;
}

/* vignette */

body::before{
    content:"";

    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at center,
    transparent 30%,
    rgba(0,0,0,0.55) 100%);

    pointer-events:none;
    z-index:200;
}

/* wall texture */

body::after{
    content:"";

    position:fixed;
    inset:0;

    opacity:.08;

    background-image:
    repeating-linear-gradient(
    90deg,
    rgba(255,255,255,.04) 0px,
    rgba(255,255,255,.04) 2px,
    transparent 2px,
    transparent 8px);

    mix-blend-mode:overlay;

    pointer-events:none;
}

/* =========================================================
   ROOM
========================================================= */

.room{

    position:relative;

    width:100%;
    height:100vh;

    overflow:hidden;

    perspective:2000px;
}

/* ceiling light */

.ceiling-light{

    position:absolute;

    width:900px;
    height:900px;

    left:50%;
    top:-600px;

    transform:translateX(-50%);

    background:
    radial-gradient(circle,
    rgba(255,192,92,.65) 0%,
    rgba(255,192,92,.25) 30%,
    transparent 70%);

    filter:blur(30px);

    pointer-events:none;

    z-index:1;
}

/* =========================================================
   WALL SHADOWS
========================================================= */

.wall-shadow-left,
.wall-shadow-right{

    position:absolute;
    top:0;
    bottom:0;
    width:400px;

    pointer-events:none;
}

.wall-shadow-left{
    left:0;

    background:
    linear-gradient(to right,
    rgba(0,0,0,.55),
    transparent);
}

.wall-shadow-right{
    right:0;

    background:
    linear-gradient(to left,
    rgba(0,0,0,.55),
    transparent);
}

/* =========================================================
   SHELF
========================================================= */

.shelf{

    position:absolute;

    width:1200px;
    height:36px;

    left:50%;
    top:120px;

    transform:
    translateX(-50%)
    perspective(1200px)
    rotateX(70deg);

    border-radius:12px;

    background:
    linear-gradient(to bottom,
    #8b6238 0%,
    #5e3c22 40%,
    #3a2212 100%);

    box-shadow:
    0 20px 40px rgba(0,0,0,.55),
    inset 0 3px 0 rgba(255,255,255,.15),
    inset 0 -8px 10px rgba(0,0,0,.4);

    z-index:20;
}

.shelf::before{

    content:"";

    position:absolute;

    inset:-20px 0 auto 0;

    height:20px;

    background:
    linear-gradient(to bottom,
    rgba(0,0,0,.25),
    transparent);

}

/* =========================================================
   DECOR
========================================================= */

.decor{

    position:absolute;
    z-index:25;
}

.jar{
    width:90px;
    height:120px;

    left:22%;
    top:48px;

    border-radius:18px;

    background:
    linear-gradient(to bottom,
    #d8b277,
    #8b5d2d);

    box-shadow:
    inset 0 8px 15px rgba(255,255,255,.25),
    inset 0 -15px 25px rgba(0,0,0,.4),
    0 15px 25px rgba(0,0,0,.4);
}

.plant{
    width:130px;
    height:130px;

    right:22%;
    top:42px;
}

.plant .pot{

    position:absolute;
    bottom:0;

    width:100px;
    height:55px;

    left:15px;

    border-radius:0 0 18px 18px;

    background:
    linear-gradient(to bottom,
    #9a6038,
    #5d3419);

    box-shadow:
    inset 0 4px 0 rgba(255,255,255,.15),
    inset 0 -12px 20px rgba(0,0,0,.4),
    0 15px 25px rgba(0,0,0,.35);
}

.leaf{
    position:absolute;
    background:#4f8d4c;
    border-radius:100px 100px 0 100px;
    transform-origin:bottom center;
}

.leaf1{
    width:45px;
    height:80px;
    left:18px;
    top:0;
    transform:rotate(-25deg);
}

.leaf2{
    width:45px;
    height:90px;
    left:42px;
    top:-8px;
}

.leaf3{
    width:45px;
    height:80px;
    right:18px;
    top:0;
    transform:rotate(25deg);
}

/* =========================================================
   TAVERN SIGN
========================================================= */

.sign-wrap{

    position:absolute;

    left:140px;
    top:90px;

    width:320px;
    height:300px;

    z-index:40;
}

.chain{

    position:absolute;

    width:4px;
    height:110px;

    background:
    linear-gradient(to bottom,
    #d4b06d,
    #6e4d24);

    top:0;

    box-shadow:
    0 0 10px rgba(255,185,90,.3);
}

.chain.left{
    left:70px;
}

.chain.right{
    right:70px;
}

.sign{

    position:absolute;

    bottom:0;

    width:100%;
    height:190px;

    border-radius:30px;

    transform:
    perspective(1000px)
    rotateY(7deg)
    rotateZ(-2deg);

    background:
    linear-gradient(to bottom,
    #9b6c3b 0%,
    #6b421f 50%,
    #3b2413 100%);

    box-shadow:
    0 35px 45px rgba(0,0,0,.55),
    inset 0 5px 0 rgba(255,255,255,.1),
    inset 0 -10px 25px rgba(0,0,0,.5),
    0 0 40px rgba(255,173,80,.12);

    border:6px solid #c89c5a;
}

.sign::before{

    content:"";

    position:absolute;
    inset:10px;

    border-radius:20px;

    border:2px solid rgba(255,223,161,.25);
}

.sign-text{

    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-direction:column;

    font-family:'Cinzel',serif;

    text-align:center;

    font-size:38px;
    line-height:1.15;

    color:#f5dfb0;

    text-shadow:
    0 2px 0 #3b2412,
    0 8px 18px rgba(0,0,0,.5);
}

/* =========================================================
   MACHINE HERO
========================================================= */

.machine-stage{

    position:absolute;

    width:760px;
    height:980px;

    left:50%;
    top:130px;

    transform:
    translateX(-50%)
    perspective(2200px)
    rotateX(2deg);

    z-index:60;
}

/* bloom */

.machine-stage::before{

    content:"";

    position:absolute;

    width:1200px;
    height:1200px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
    radial-gradient(circle,
    rgba(255,177,65,.45) 0%,
    rgba(255,177,65,.15) 30%,
    transparent 65%);

    filter:blur(20px);

    pointer-events:none;
}

/* OUTER FRAME */

.machine-outer{

    position:absolute;

    inset:0;

    border-radius:90px;

    background:
    linear-gradient(
    180deg,
    #ffdb9d 0%,
    #d39b47 7%,
    #8b5a23 20%,
    #3b2313 40%,
    #2b180d 50%,
    #6f451d 75%,
    #f0c36f 100%);

    box-shadow:
    inset 0 5px 0 rgba(255,255,255,.3),
    inset 0 -18px 25px rgba(0,0,0,.65),
    0 60px 80px rgba(0,0,0,.65),
    0 0 80px rgba(255,184,80,.2);

    overflow:hidden;
}

/* reflection */

.machine-outer::before{

    content:"";

    position:absolute;

    left:-120px;
    top:-80px;

    width:280px;
    height:1200px;

    background:
    linear-gradient(to right,
    rgba(255,255,255,.25),
    rgba(255,255,255,.04),
    transparent);

    transform:rotate(12deg);

    filter:blur(6px);

    opacity:.7;
}

/* INNER */

.machine-inner{

    position:absolute;

    inset:35px;

    border-radius:70px;

    background:
    linear-gradient(to bottom,
    #29170d,
    #110b07);

    box-shadow:
    inset 0 0 80px rgba(0,0,0,.9),
    inset 0 10px 20px rgba(255,255,255,.05);
}

/* SLOT */

.machine-slot{

    position:absolute;

    left:55px;
    right:55px;
    top:90px;
    bottom:180px;

    overflow:hidden;

    border-radius:55px;

    background:
    linear-gradient(to bottom,
    #1a100b,
    #000);

    box-shadow:
    inset 0 0 60px rgba(0,0,0,.9),
    0 0 80px rgba(255,182,78,.18);
}

/* center glow */

.center-glow{

    position:absolute;

    left:25px;
    right:25px;

    top:50%;

    transform:translateY(-50%);

    height:150px;

    border-radius:35px;

    border:4px solid rgba(255,224,145,.8);

    box-shadow:
    0 0 60px rgba(255,197,95,.9),
    inset 0 0 35px rgba(255,236,176,.45),
    0 0 120px rgba(255,180,70,.45);

    background:
    linear-gradient(to bottom,
    rgba(255,228,168,.12),
    rgba(255,171,53,.05));

    z-index:30;
}

/* =========================================================
   SPINNER TRACK
========================================================= */

#spinnerTrack{

    position:absolute;

    width:100%;

    padding:120px 30px;

    transition:
    transform 6s cubic-bezier(.1,.9,.15,1);

}

/* =========================================================
   CARDS
========================================================= */

.card{

    position:relative;

    height:140px;

    margin-bottom:18px;

    border-radius:34px;

    overflow:hidden;

    background:
    linear-gradient(to bottom,
    #f8e8c7 0%,
    #e0c89c 50%,
    #c79f68 100%);

    box-shadow:
    inset 0 3px 0 rgba(255,255,255,.4),
    inset 0 -10px 18px rgba(0,0,0,.18),
    0 18px 28px rgba(0,0,0,.35);

    border:3px solid #d8b279;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:'Cinzel',serif;

    font-size:42px;
    font-weight:700;

    color:#533015;

    text-shadow:
    0 1px 0 rgba(255,255,255,.4);

    transform:
    perspective(1000px)
    rotateX(2deg);
}

/* paper texture */

.card::before{

    content:"";

    position:absolute;
    inset:0;

    background-image:
    radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);

    background-size:12px 12px;

    opacity:.3;
}

/* edge shadow */

.card::after{

    content:"";

    position:absolute;

    inset:auto 0 0 0;

    height:40px;

    background:
    linear-gradient(to top,
    rgba(0,0,0,.18),
    transparent);
}

/* =========================================================
   ARROWS
========================================================= */

.arrow{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    width:90px;
    height:90px;

    z-index:80;
}

.arrow::before{

    content:"";

    position:absolute;

    inset:0;

    clip-path:
    polygon(0 50%,100% 0,100% 100%);

    background:
    linear-gradient(to bottom,
    #ffd98a,
    #d6922e,
    #6d4315);

    box-shadow:
    inset 0 4px 0 rgba(255,255,255,.25),
    0 0 35px rgba(255,193,80,.45);
}

.arrow::after{

    content:"";

    position:absolute;

    width:24px;
    height:24px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    #fff7d8,
    #ffc55c 60%,
    #8f4f12);

    left:55px;
    top:33px;

    box-shadow:
    0 0 20px rgba(255,198,85,.7);
}

.left-arrow{
    left:-38px;
}

.right-arrow{

    right:-38px;

    transform:
    translateY(-50%)
    rotateY(180deg);
}

/* =========================================================
   SPIN BUTTON
========================================================= */

.spin-button{

    position:absolute;

    left:50%;
    bottom:-80px;

    transform:translateX(-50%);

    width:380px;
    height:120px;

    border:none;

    cursor:pointer;

    border-radius:999px;

    background:
    linear-gradient(to bottom,
    #ffdd9f 0%,
    #d29339 20%,
    #8b561d 55%,
    #593311 100%);

    box-shadow:
    inset 0 5px 0 rgba(255,255,255,.35),
    inset 0 -15px 25px rgba(0,0,0,.5),
    0 20px 35px rgba(0,0,0,.5),
    0 0 45px rgba(255,178,70,.25);

    overflow:hidden;
}

.spin-button::before{

    content:"";

    position:absolute;

    left:-100px;
    top:-40px;

    width:180px;
    height:200px;

    background:
    linear-gradient(to right,
    rgba(255,255,255,.45),
    transparent);

    transform:rotate(15deg);

    filter:blur(5px);
}

.spin-button span{

    position:relative;

    font-family:'Cinzel',serif;

    font-size:54px;
    font-weight:900;

    color:#fff2cc;

    text-shadow:
    0 2px 0 #4d2f13,
    0 10px 18px rgba(0,0,0,.45);
}

.spin-button:hover{

    transform:
    translateX(-50%)
    translateY(-4px);

    box-shadow:
    inset 0 5px 0 rgba(255,255,255,.35),
    inset 0 -15px 25px rgba(0,0,0,.5),
    0 28px 45px rgba(0,0,0,.55),
    0 0 65px rgba(255,178,70,.35);
}

/* =========================================================
   WINNER TEXT
========================================================= */

#winnerText{

    position:absolute;

    width:100%;

    bottom:-170px;

    text-align:center;

    font-family:'Cinzel',serif;

    font-size:44px;
    font-weight:700;

    color:#ffe3b2;

    text-shadow:
    0 0 25px rgba(255,189,87,.55),
    0 4px 15px rgba(0,0,0,.6);
}

/* =========================================================
   TABLE
========================================================= */

.table{

    position:absolute;

    left:-5%;
    right:-5%;
    bottom:-140px;

    height:330px;

    border-radius:50% 50% 0 0;

    background:
    linear-gradient(to bottom,
    #8b5b30 0%,
    #5d3517 40%,
    #2b1609 100%);

    box-shadow:
    inset 0 10px 0 rgba(255,255,255,.08),
    inset 0 -30px 50px rgba(0,0,0,.55),
    0 -20px 80px rgba(0,0,0,.6);

    z-index:120;
}

/* wood grain */

.table::before{

    content:"";

    position:absolute;
    inset:0;

    opacity:.08;

    background-image:
    repeating-linear-gradient(
    90deg,
    rgba(255,255,255,.12) 0px,
    rgba(255,255,255,.12) 2px,
    transparent 2px,
    transparent 16px);
}

/* =========================================================
   FLOWERS
========================================================= */

.flower-area{

    position:absolute;

    right:120px;
    bottom:120px;

    width:260px;
    height:260px;

    z-index:140;
}

.vase{

    position:absolute;

    bottom:0;
    left:80px;

    width:110px;
    height:140px;

    border-radius:0 0 50px 50px;

    background:
    linear-gradient(to bottom,
    #b7d7de 0%,
    #6a98a4 45%,
    #385661 100%);

    box-shadow:
    inset 0 6px 0 rgba(255,255,255,.25),
    inset 0 -12px 20px rgba(0,0,0,.35),
    0 18px 25px rgba(0,0,0,.45);
}

.flower{

    position:absolute;

    width:90px;
    height:90px;

    border-radius:50%;
}

.flower::before,
.flower::after{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;
}

.flower1{
    left:20px;
    top:10px;
}

.flower2{
    left:90px;
    top:-10px;
}

.flower3{
    left:150px;
    top:20px;
}

.flower::before{

    background:
    radial-gradient(circle,
    #ffd7ea 0%,
    #ff91b6 70%,
    #b34d70 100%);

    filter:blur(2px);
}

.flower::after{

    transform:scale(.45);

    background:
    radial-gradient(circle,
    #fff8cc,
    #ffc15d);

}

/* =========================================================
   PARTICLES
========================================================= */

.particle{

    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ffd791;

    opacity:.55;

    box-shadow:
    0 0 15px rgba(255,192,82,.65);

    animation:
    float 12s linear infinite;
}

@keyframes float{

    from{
        transform:
        translateY(0px);
        opacity:0;
    }

    10%{
        opacity:.6;
    }

    100%{
        transform:
        translateY(-900px);
        opacity:0;
    }
}

/* =========================================================
   RESTAURANT LIST
========================================================= */

.restaurant-panel{

    position:absolute;

    left:60px;
    bottom:90px;

    width:360px;

    z-index:140;
}

.restaurant-title{

    font-family:'Cinzel',serif;

    font-size:36px;

    margin-bottom:20px;

    color:#ffe1aa;

    text-shadow:
    0 4px 15px rgba(0,0,0,.45);
}

.add-row{

    display:flex;
    gap:10px;

    margin-bottom:18px;
}

.add-row input{

    flex:1;

    height:60px;

    border:none;
    outline:none;

    padding:0 20px;

    border-radius:18px;

    background:
    linear-gradient(to bottom,
    #f7e3c0,
    #d6b07d);

    font-size:18px;
    font-weight:700;

    color:#4b2d16;

    box-shadow:
    inset 0 4px 0 rgba(255,255,255,.35),
    inset 0 -10px 18px rgba(0,0,0,.15);
}

.add-row button{

    width:90px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(to bottom,
    #ffd18a,
    #b36c1f);

    color:white;

    font-weight:900;

    cursor:pointer;

    box-shadow:
    inset 0 4px 0 rgba(255,255,255,.25),
    0 10px 20px rgba(0,0,0,.35);
}

.restaurant-item{

    background:
    linear-gradient(to bottom,
    rgba(255,235,195,.95),
    rgba(206,161,101,.95));

    border-radius:18px;

    padding:16px;

    margin-bottom:12px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    box-shadow:
    inset 0 3px 0 rgba(255,255,255,.25),
    0 10px 20px rgba(0,0,0,.3);
}

.restaurant-name{

    color:#4d2e14;

    font-weight:900;

    font-size:18px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1100px){

    .machine-stage{
        transform:
        translateX(-50%)
        scale(.72);
    }

    .restaurant-panel{
        transform:scale(.9);
        left:20px;
    }

    .sign-wrap{
        display:none;
    }

    .flower-area{
        display:none;
    }
}

</style>

<script>

/* =========================================================
   PARTICLES
========================================================= */

for(let i = 0; i < 35; i++){

    const p = document.createElement("div");

    p.className = "particle";

    p.style.left =
    Math.random() * 100 + "%";

    p.style.bottom =
    "-20px";

    p.style.animationDelay =
    (Math.random() * 12) + "s";

    p.style.animationDuration =
    (10 + Math.random() * 8) + "s";

    document.body.appendChild(p);
}

/* =========================================================
   DATA
========================================================= */

let restaurants =
JSON.parse(localStorage.getItem("restaurants"))
|| [

    {name:"Olive Garden",crossed:false},
    {name:"Texas Roadhouse",crossed:false},
    {name:"Chick-fil-A",crossed:false},
    {name:"Panera Bread",crossed:false},
    {name:"Outback Steakhouse",crossed:false}

];

const spinnerTrack =
document.getElementById("spinnerTrack");

const restaurantList =
document.getElementById("restaurantList");

let currentOffset = 5000;

/* =========================================================
   SAVE
========================================================= */

function saveData(){

    localStorage.setItem(
    "restaurants",
    JSON.stringify(restaurants));
}

/* =========================================================
   RENDER LIST
========================================================= */

function renderRestaurants(){

    restaurantList.innerHTML = "";

    restaurants.forEach((r,index)=>{

        const item =
        document.createElement("div");

        item.className =
        "restaurant-item";

        item.innerHTML = `
            <div class="restaurant-name"
            style="
            ${r.crossed ?
            'opacity:.45;text-decoration:line-through;' :
            ''}
            ">
                ${r.name}
            </div>
        `;

        restaurantList.appendChild(item);
    });

    renderSpinner();

    saveData();
}

/* =========================================================
   SPINNER BUILD
========================================================= */

function renderSpinner(){

    spinnerTrack.innerHTML = "";

    const active =
    restaurants.filter(r=>!r.crossed);

    const repeated = [];

    for(let i = 0; i < 250; i++){

        repeated.push(...active);
    }

    repeated.forEach(r=>{

        const card =
        document.createElement("div");

        card.className = "card";

        card.textContent = r.name;

        spinnerTrack.appendChild(card);
    });
}

/* =========================================================
   ADD
========================================================= */

function addRestaurant(){

    const input =
    document.getElementById("restaurantInput");

    const value =
    input.value.trim();

    if(!value) return;

    restaurants.push({

        name:value,
        crossed:false
    });

    input.value = "";

    renderRestaurants();
}

/* =========================================================
   SPIN
========================================================= */

function spinWheel(){

    const active =
    restaurants.filter(r=>!r.crossed);

    if(active.length === 0) return;

    const winnerIndex =
    Math.floor(Math.random() * active.length);

    const winner =
    active[winnerIndex];

    const cardHeight = 158;

    const machine =
    document.querySelector(".machine-slot");

    const machineHeight =
    machine.offsetHeight;

    const trackHeight =
    spinnerTrack.scrollHeight;

    const visibleBottom =
    currentOffset + machineHeight;

    const loopHeight =
    active.length * cardHeight;

    if(visibleBottom >
    trackHeight - machineHeight){

        currentOffset -=
        loopHeight * 120;

        spinnerTrack.style.transition =
        "none";

        spinnerTrack.style.transform =
        `translateY(-${currentOffset}px)`;

        spinnerTrack.offsetHeight;
    }

    const currentIndex =
    Math.round(currentOffset / cardHeight);

    const spinsForward =
    (Math.floor(Math.random() * 10) + 24)
    * active.length;

    const currentLoopIndex =
    currentIndex % active.length;

    let moveToWinner =
    winnerIndex - currentLoopIndex;

    if(moveToWinner < 0){

        moveToWinner +=
        active.length;
    }

    const targetIndex =
    currentIndex +
    spinsForward +
    moveToWinner;

    const centerOffset = 335;

    currentOffset =
    (targetIndex * cardHeight)
    - centerOffset;

    spinnerTrack.style.transition =
    "transform 6.5s cubic-bezier(.08,.92,.13,1)";

    spinnerTrack.style.transform =
    `translateY(-${currentOffset}px)`;

    document.getElementById("winnerText")
    .innerHTML =
    `✨ Tonight: ??? ✨`;

    setTimeout(()=>{

        document.getElementById("winnerText")
        .innerHTML =
        `✨ Tonight: ${winner.name} ✨`;

    },6500);
}

renderRestaurants();

</script>
