<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Dinner Picker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Nunito',sans-serif;
    background:#ece4d8;
    color:#4b4037;
    min-height:100vh;
    overflow-x:hidden;
}

.header{
    text-align:center;
    padding:45px 20px 20px;
}

.header h1{
    font-size:58px;
    font-weight:900;
    color:#51463d;
}

.header p{
    margin-top:10px;
    font-size:20px;
    color:#8c8178;
}

.layout{
    width:95%;
    max-width:1650px;
    margin:20px auto 40px;
    display:grid;
    grid-template-columns:350px 1fr;
    gap:28px;
}

.sidebar{
    background:#efe7dc;
    border-radius:38px;
    padding:24px;
    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.7),
        0 15px 35px rgba(80,60,40,.08);
}

.input-row{
    display:flex;
    gap:12px;
    margin-bottom:24px;
}

.input-row input{
    flex:1;
    border:none;
    border-radius:18px;
    padding:18px;
    background:#ddd3c3;
    font-size:18px;
    font-weight:700;
    outline:none;
    color:#4c4139;
}

.input-row button{
    border:none;
    background:#8ea67a;
    color:white;
    font-weight:900;
    border-radius:18px;
    padding:0 22px;
    cursor:pointer;
    font-size:18px;
    transition:.2s;
}

.input-row button:hover{
    transform:translateY(-2px);
    background:#7d956a;
}

.restaurant-list{
    display:flex;
    flex-direction:column;
    gap:14px;
    max-height:72vh;
    overflow:auto;
    padding-right:4px;
}

.restaurant-card{
    background:#e7ded1;
    border-radius:24px;
    padding:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.65),
        0 6px 16px rgba(0,0,0,.05);
}

.restaurant-name{
    font-size:22px;
    font-weight:900;
    word-break:break-word;
}

.restaurant-name.crossed{
    text-decoration:line-through;
    opacity:.45;
}

.card-actions{
    display:flex;
    gap:8px;
}

.card-actions button{
    border:none;
    border-radius:14px;
    padding:12px 14px;
    font-weight:800;
    cursor:pointer;
    color:white;
}

.cross-btn{
    background:#90a97d;
}

.delete-btn{
    background:#ba7b70;
}

.main{
    display:flex;
    flex-direction:column;
    gap:26px;
}

.machine{
    background:#efe7dc;
    border-radius:42px;
    padding:28px;
    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.7),
        0 18px 40px rgba(70,50,30,.08);
}

.reel-window{
    position:relative;
    height:520px;
    overflow:hidden;
    border-radius:38px;
    background:#e5dccf;
    box-shadow:inset 0 0 0 10px rgba(255,255,255,.2);
}

.reel-window::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:130px;
    background:linear-gradient(to bottom,#e5dccf 0%,rgba(229,220,207,0) 100%);
    z-index:4;
}

.reel-window::after{
    content:'';
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:130px;
    background:linear-gradient(to top,#e5dccf 0%,rgba(229,220,207,0) 100%);
    z-index:4;
}

.center-highlight{
    position:absolute;
    left:20px;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    height:170px;
    border-radius:34px;
    background:rgba(146,171,122,.22);
    border:4px solid rgba(135,160,110,.65);
    box-shadow:0 0 30px rgba(146,171,122,.4);
    z-index:2;
    pointer-events:none;
}

.reel{
    position:absolute;
    width:100%;
    top:0;
    left:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
    padding:170px 0;
    transition:transform 5s cubic-bezier(.08,.9,.15,1);
}

.reel-card{
    width:78%;
    height:145px;
    border-radius:34px;
    background:#f5efe6;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    font-size:42px;
    font-weight:900;
    color:#4b4138;
    box-shadow:
        inset 0 3px 0 rgba(255,255,255,.9),
        0 10px 24px rgba(0,0,0,.08);
    flex-shrink:0;
}

.reel-card.winner{
    background:#93ab7b;
    color:white;
    transform:scale(1.05);
    box-shadow:0 0 40px rgba(146,171,122,.7);
}

.spin-button{
    border:none;
    border-radius:28px;
    height:88px;
    background:#90a97d;
    color:white;
    font-size:34px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(126,148,104,.4);
    transition:.2s;
}

.spin-button:hover{
    transform:translateY(-3px);
}

.winner-box{
    background:#efe7dc;
    border-radius:38px;
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    font-size:44px;
    font-weight:900;
    color:#5c4f46;
    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.7),
        0 18px 35px rgba(70,50,30,.08);
}

@media (max-width:1100px){
    .layout{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:42px;
    }

    .reel-card{
        font-size:28px;
    }
}
</style>

</head>
<body>

<div class="header">
    <h1>🍽 Family Dinner Picker</h1>
    <p>Spin the cozy dinner machine and let fate decide tonight's meal.</p>
</div>
