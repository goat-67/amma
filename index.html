# Full Single-File Hearthstone Style Family Dinner Picker

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Dinner Picker</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        linear-gradient(to bottom,
        #f8f3ea,
        #efe4d2);

    font-family: Georgia, serif;

    color: #5b3d24;
}

.page {
    max-width: 1500px;
    margin: auto;
    padding: 40px;
}

.title {
    text-align: center;
    margin-bottom: 35px;
}

.title h1 {
    margin: 0;
    font-size: 72px;
    color: #47653d;
}

.title p {
    margin-top: 10px;
    font-size: 28px;
    opacity: 0.7;
}

.layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 40px;
}

.sidebar {
    background: rgba(255,255,255,0.35);

    border-radius: 30px;

    padding: 25px;

    box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.5),
        0 10px 25px rgba(0,0,0,0.08);
}

.sidebar h2 {
    margin-top: 0;
    text-align: center;
    font-size: 36px;
    color: #5f774d;
}

.add-row {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

#restaurant-input {
    flex: 1;

    border: none;
    outline: none;

    border-radius: 18px;

    padding: 18px;

    font-size: 20px;

    background: #efe6d6;
}

#add-btn {
    border: none;

    background:
        linear-gradient(to bottom,
        #7ca168,
        #5d7f4b);

    color: white;

    border-radius: 18px;

    padding: 0 25px;

    font-size: 22px;
    font-weight: 700;

    cursor: pointer;
}

.restaurant-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.restaurant-item {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    background: rgba(255,255,255,0.35);

    padding: 14px;

    border-radius: 20px;
}

.restaurant-item.crossed {
    opacity: 0.45;
}

.restaurant-name {
    font-size: 24px;
    font-weight: 700;

    word-break: break-word;
}

.row-buttons {
    display: flex;
    gap: 8px;
}

.small-btn {
    border: none;

    border-radius: 14px;

    padding: 10px 14px;

    cursor: pointer;

    font-weight: 700;

    background: #7ca168;
    color: white;
}

.delete-btn {
    background: #bf7f6b;
}

.main {
    display: flex;
    justify-content: center;
}

.spinner-shell {
    width: 500px;
    text-align: center;
}

.spinner-window {
    position: relative;

    height: 720px;

    overflow: hidden;

    border-radius: 45px;

    background:
        linear-gradient(to bottom,
        #734a2a,
        #a16d3f,
        #734a2a);

    padding: 25px;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,0.45),
        0 25px 50px rgba(0,0,0,0.18);
}

#spinner-track {
    display: flex;
    flex-direction: column;
    gap: 14px;

    transition:
        transform 6s cubic-bezier(0.08,0.82,0.14,1);
}

.spin-card {
    min-height: 120px;

    border-radius: 24px;

    background:
        linear-gradient(to bottom,
        #fff6e7,
        #eadcc7);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 15px;

    text-align: center;

    font-size: 38px;
    font-weight: 700;

    color: #5a3a22;

    box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.65),
        0 6px 15px rgba(0,0,0,0.18);

    transition: 0.35s;
}

.spin-card.winner {
    background:
        linear-gradient(to bottom,
        #fff7d8,
        #ffe9a7);

    transform: scale(1.03);

    box-shadow:
        0 0 30px rgba(255,215,100,0.9),
        0 0 70px rgba(255,215,100,0.45);
}

.center-highlight {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 90%;
    height: 132px;

    border-radius: 28px;

    border: 5px solid rgba(255,223,120,0.95);

    box-shadow:
        0 0 30px rgba(255,215,120,0.8);

    pointer-events: none;
}

#spin-btn {
    margin-top: 28px;

    border: none;

    border-radius: 999px;

    padding: 24px 100px;

    font-size: 42px;
    font-weight: 900;

    color: white;

    background:
        linear-gradient(to bottom,
        #5f874c,
        #3d5d30);

    cursor: pointer;

    box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.45),
        0 14px 30px rgba(0,0,0,0.2);

    transition: 0.2s;
}

#spin-btn:hover {
    transform: translateY(-2px) scale(1.02);
}

@media (max-width: 1100px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .main {
        margin-top: 20px;
    }

    .spinner-shell {
        width: 100%;
        max-width: 500px;
    }

    .title h1 {
        font-size: 48px;
    }
}

</style>
</head>
<body>

<div class="page">

    <div class="title">
        <h1>🍽 Family Dinner Picker</h1>
        <p>Pick tonight's restaurant with a Hearthstone-style spin!</p>
    </div>

    <div class="layout">

        <div class="sidebar">

            <h2>Your Restaurants</h2>

            <div class="add-row">
                <input id="restaurant-input" placeholder="Add restaurant..." />
                <button id="add-btn">Add</button>
            </div>

            <div class="restaurant-list" id="restaurant-list"></div>

        </div>

        <div class="main">

            <div class="spinner-shell">

                <div class="spinner-window">

                    <div id="spinner-track"></div>

                    <div class="center-highlight"></div>

                </div>

                <button id="spin-btn">SPIN</button>

            </div>

        </div>

    </div>

</div>

<script>

let restaurants = JSON.parse(localStorage.getItem("restaurants")) || [
    { name: "Olive Garden", crossed: false },
    { name: "Texas Roadhouse", crossed: false },
    { name: "Chick-fil-A", crossed: false },
    { name: "Panera Bread", crossed: false },
    { name: "Outback", crossed: false },
    { name: "Red Lobster", crossed: false }
];

const listEl = document.getElementById("restaurant-list");
const input = document.getElementById("restaurant-input");
const addBtn = document.getElementById("add-btn");
const track = document.getElementById("spinner-track");
const spinBtn = document.getElementById("spin-btn");

function save() {
    localStorage.setItem("restaurants", JSON.stringify(restaurants));
}

function renderRestaurants() {

    listEl.innerHTML = "";

    restaurants.forEach((restaurant, index) => {

        const item = document.createElement("div");

        item.className = "restaurant-item";

        if (restaurant.crossed) {
            item.classList.add("crossed");
        }

        item.innerHTML = `
            <div class="restaurant-name">${restaurant.name}</div>

            <div class="row-buttons">
                <button class="small-btn">
                    ${restaurant.crossed ? "Undo" : "Cross Off"}
                </button>

                <button class="small-btn delete-btn">Delete</button>
            </div>
        `;

        const buttons = item.querySelectorAll("button");

        buttons[0].onclick = () => {
            restaurant.crossed = !restaurant.crossed;
            save();
            renderRestaurants();
        };

        buttons[1].onclick = () => {
            restaurants.splice(index, 1);
            save();
            renderRestaurants();
        };

        listEl.appendChild(item);
    });
}

function getEnabledRestaurants() {
    return restaurants.filter(r => !r.crossed);
}

function buildSpinner(winner = null) {

    track.innerHTML = "";

    const enabled = getEnabledRestaurants();

    const spinPool = [];

    const winnerIndex = 34;

    for (let i = 0; i < 60; i++) {

        if (i === winnerIndex && winner) {
            spinPool.push(winner);
        }
        else {
            spinPool.push(
                enabled[
                    Math.floor(Math.random() * enabled.length)
                ].name
            );
        }
    }

    spinPool.forEach((name, index) => {

        const card = document.createElement("div");

        card.className = "spin-card";

        card.innerText = name;

        if (index === winnerIndex) {
            card.dataset.winner = "true";
        }

        track.appendChild(card);
    });
}

function spin() {

    const enabled = getEnabledRestaurants();

    if (enabled.length === 0) {
        alert("No restaurants available.");
        return;
    }

    spinBtn.disabled = true;

    const winner =
        enabled[Math.floor(Math.random() * enabled.length)].name;

    buildSpinner(winner);

    track.style.transition = "none";
    track.style.transform = "translateY(0px)";

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            track.style.transition =
                "transform 6s cubic-bezier(0.08,0.82,0.14,1)";

            const moveY = -(34 * 134) + 295;

            track.style.transform =
                `translateY(${moveY}px)`;
        });
    });

    setTimeout(() => {

        const winnerCard =
            document.querySelector('[data-winner="true"]');

        if (winnerCard) {
            winnerCard.classList.add("winner");
        }

        spinBtn.disabled = false;

    }, 6100);
}

addBtn.onclick = () => {

    const value = input.value.trim();

    if (!value) return;

    restaurants.push({
        name: value,
        crossed: false
    });

    input.value = "";

    save();
    renderRestaurants();
};

input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        addBtn.click();
    }
});

spinBtn.onclick = spin;

renderRestaurants();
buildSpinner();

</script>

</body>
</html>
```
