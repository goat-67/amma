<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Nunito:wght@400;700;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    height:100vh;

    background:
    radial-gradient(circle at top,#fff8ea 0%,#f6efdf 35%,#eee3cf 100%);

    font-family:'Nunito',sans-serif;
    color:#5d4636;

    position:relative;
}

/* soft paper grain vibe */
body::before{
    content:"";
    position:fixed;
    inset:0;

    background-image:
    radial-gradient(rgba(120,90,60,0.035) 1px, transparent 1px);

    background-size:4px 4px;

    opacity:.35;
    pointer-events:none;
}

/* warm vignette */
body::after{
    content:"";
    position:fixed;
    inset:0;

    box-shadow:
    inset 0 0 180px rgba(130,90,40,.12);

    pointer-events:none;
}

/* ===== MAIN LAYOUT ===== */

.main-layout{
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:45px;

    padding:24px 40px 90px;
}

/* ===== LEFT PANEL ===== */

.left-panel{

    width:320px;
    height:760px;

    background:
    linear-gradient(to bottom,
    rgba(255,255,255,.65),
    rgba(255,255,255,.45));

    border-radius:36px;

    border:2px solid rgba(255,255,255,.55);

    backdrop-filter:blur(8px);

    box-shadow:
    0 10px 30px rgba(110,80,40,.12),
    inset 0 1px 0 rgba(255,255,255,.7);

    padding:28px;
}

.panel-title{

    font-family:'Cormorant Garamond',serif;

    font-size:58px;

    line-height:.95;

    text-align:center;

    color:#9ca88d;

    margin-bottom:26px;
}

.add-row{
    display:flex;
    gap:14px;
    margin-bottom:24px;
}

.add-row input{

    flex:1;

    border:none;

    background:#f4ede0;

    border-radius:20px;

    padding:18px 18px;

    font-size:18px;

    color:#6f5b49;

    outline:none;

    box-shadow:
    inset 0 2px 4px rgba(0,0,0,.05);
}

.add-row button{

    border:none;

    width:92px;

    border-radius:20px;

    background:
    linear-gradient(to bottom,#98b17d,#7f9c65);

    color:white;

    font-weight:900;

    font-size:20px;

    cursor:pointer;

    box-shadow:
    0 8px 18px rgba(90,120,70,.22),
    inset 0 1px 0 rgba(255,255,255,.3);

    transition:.18s;
}

.add-row button:hover{
    transform:translateY(-2px);
}

/* ===== RESTAURANT CARDS ===== */

.restaurant-list{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.restaurant-card{

    background:
    linear-gradient(to bottom,#fffaf0,#f8efdd);

    border-radius:24px;

    padding:18px 18px;

    border:2px solid #eadcc4;

    box-shadow:
    0 5px 16px rgba(120,90,50,.08),
    inset 0 1px 0 rgba(255,255,255,.75);

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.restaurant-name{
    font-size:19px;
    font-weight:800;
}

.card-buttons{
    display:flex;
    gap:10px;
}

.cross-btn{

    border:none;

    background:
    linear-gradient(to bottom,#98b17d,#88a56f);

    color:white;

    border-radius:18px;

    padding:12px 18px;

    font-weight:800;

    cursor:pointer;
}

.delete-btn{

    width:50px;
    height:50px;

    border:none;

    border-radius:18px;

    background:#f3ddd6;

    color:#9c6255;

    font-size:20px;

    cursor:pointer;
}

/* ===== CENTER ===== */

.center-wrap{
    width:760px;
    text-align:center;
    position:relative;
}

/* title */

.hero-title{

    font-family:'Cormorant Garamond',serif;

    font-size:96px;

    line-height:.9;

    color:#2f6529;

    margin-bottom:10px;

    text-shadow:
    0 2px 0 rgba(255,255,255,.5);
}

.hero-sub{

    font-size:30px;

    color:#7b6250;

    margin-bottom:34px;
}

/* ===== WHEEL AREA ===== */

.machine-glow{

    position:absolute;

    left:50%;
    top:260px;

    transform:translateX(-50%);

    width:520px;
    height:520px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(255,230,150,.75) 0%,
    rgba(255,230,150,.22) 40%,
    transparent 72%);

    filter:blur(10px);

    z-index:0;
}

.machine{

    position:relative;

    margin:auto;

    width:430px;
    height:610px;

    border-radius:52px;

    background:
    linear-gradient(
    145deg,
    #dca85c 0%,
    #5c2b10 16%,
    #321306 48%,
    #6a3215 84%,
    #d6a156 100%
    );

    padding:24px;

    box-shadow:
    0 25px 60px rgba(80,40,10,.28),
    inset 0 2px 2px rgba(255,255,255,.35),
    inset 0 -3px 8px rgba(0,0,0,.45);

    z-index:2;
}

/* viewport */

.viewport{

    height:520px;

    border-radius:34px;

    overflow:hidden;

    background:
    linear-gradient(to bottom,#3a1809,#5f2b11);

    padding:18px;

    position:relative;

    box-shadow:
    inset 0 6px 18px rgba(0,0,0,.5);
}

/* wheel items */

.spinner-track{
    display:flex;
    flex-direction:column;
    gap:16px;

    transition:
    transform 5s cubic-bezier(.08,.8,.15,1);
}

.spin-card{

    height:118px;

    border-radius:30px;

    background:
    linear-gradient(to bottom,#fff5df,#f6e7c8);

    border:3px solid #ead0a3;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:'Cormorant Garamond',serif;

    font-size:36px;

    font-weight:700;

    color:#68472e;

    position:relative;

    box-shadow:
    0 8px 16px rgba(0,0,0,.12),
    inset 0 2px 0 rgba(255,255,255,.7);
}

/* center selected */

.spin-card.selected{

    background:
    linear-gradient(to bottom,#fff8ea,#f9ebc8);

    border:4px solid #f3cd61;

    box-shadow:
    0 0 22px rgba(255,215,90,.38),
    inset 0 2px 0 rgba(255,255,255,.8);
}

/* arrows */

.arrow{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    width:0;
    height:0;

    border-top:30px solid transparent;
    border-bottom:30px solid transparent;

    z-index:5;
}

.arrow.left{
    left:-40px;
    border-right:42px solid #e3b33d;
}

.arrow.right{
    right:-40px;
    border-left:42px solid #e3b33d;
}

/* ===== SPIN BUTTON ===== */

.spin-btn{

    margin:26px auto 0;

    width:320px;
    height:82px;

    border:none;

    border-radius:999px;

    cursor:pointer;

    font-family:'Cormorant Garamond',serif;

    font-size:48px;

    font-weight:700;

    color:#fff8ea;

    background:
    linear-gradient(to bottom,#41733c,#245328);

    box-shadow:
    0 10px 20px rgba(40,70,30,.24),
    inset 0 2px 0 rgba(255,255,255,.2);

    transition:.18s;
}

.spin-btn:hover{
    transform:translateY(-3px);
}

/* ===== SIDE SIGN ===== */

.side-sign{

    width:240px;
    height:370px;

    border-radius:36px;

    background:
    linear-gradient(to bottom,#f8ebcf,#efddbc);

    border:6px solid #c28a4d;

    box-shadow:
    0 10px 25px rgba(120,80,40,.12);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:24px;

    text-align:center;

    font-family:'Cormorant Garamond',serif;

    font-size:58px;

    line-height:1.1;

    color:#8a6140;
}

/* ===== BOTTOM BAR ===== */

.bottom-bar{

    position:fixed;

    bottom:14px;
    left:50%;

    transform:translateX(-50%);

    width:95%;

    background:
    linear-gradient(to bottom,#f2e6c8,#e9dbbb);

    border-radius:30px;

    border:2px solid #d7c7a5;

    padding:18px 30px;

    display:flex;
    justify-content:space-around;

    color:#7b624e;

    font-weight:700;

    box-shadow:
    0 6px 20px rgba(80,60,30,.08);
}

</style>

</head>
<body>

<div class="page">

    <!-- LEFT -->

    <div class="sidebar">

        <div class="sidebar-title">
            ❦ Your<br>
            Restaurants ❦
        </div>

        <div class="add-box">

            <input id="restaurantInput"
            placeholder="Add new restaurant...">

            <button onclick="addRestaurant()">
                Add
            </button>

        </div>

        <div id="restaurantList"></div>

    </div>

    <!-- CENTER -->

    <div class="center">

        <div class="hero-title">
            🍽 Family Dinner<br>
            Picker 🍽
        </div>

        <div class="hero-subtitle">
            Pick tonight's restaurant with a Hearthstone-style spin!
        </div>

        <div class="machine-wrap">

            <div class="arrow left-arrow"></div>
            <div class="arrow right-arrow"></div>

            <div class="machine-frame">

                <div class="machine">

                    <div class="winner-zone"></div>

                    <div id="track"></div>

                </div>

            </div>

        </div>

        <button class="spin-btn"
        onclick="spinWheel()">
            SPIN
        </button>

        <div id="winnerText"></div>

    </div>

    <!-- RIGHT -->

    <div class="right-side">

        <div class="sign">
            Let's<br>
            have a<br>
            great<br>
            dinner!
        </div>

        <div class="flowers">
            🌸
        </div>

    </div>

</div>

<div class="footer">

    <div class="footer-item">
        💡 Cross off places you don't want
    </div>

    <div class="footer-item">
        💾 Uses local storage automatically
    </div>

    <div class="footer-item">
        🔒 Private to this device
    </div>

</div>

<script>

let restaurants =
JSON.parse(localStorage.getItem("restaurants"))
|| [

{name:"Olive Garden",crossed:false},
{name:"Chick-fil-A",crossed:false},
{name:"Texas Roadhouse",crossed:false},
{name:"Panera Bread",crossed:false},
{name:"Red Lobster",crossed:false},
{name:"Outback Steakhouse",crossed:false},
{name:"Maggiano's",crossed:false}

];

const list = document.getElementById("restaurantList");
const track = document.getElementById("track");

/* RENDER */

function render(){

    list.innerHTML = "";

    restaurants.forEach((r,index)=>{

        const card = document.createElement("div");

        card.className = "restaurant-card";

        card.innerHTML = `

            <div class="restaurant-name"
            style="${r.crossed ? 'opacity:.4;text-decoration:line-through;' : ''}">
                ${r.name}
            </div>

            <div class="card-buttons">

                <button class="cross-btn"
                onclick="toggleCross(${index})">

                    ${r.crossed ? 'Undo' : 'Cross Off'}

                </button>

                <button class="delete-btn"
                onclick="deleteRestaurant(${index})">

                    🗑

                </button>

            </div>
        `;

        list.appendChild(card);

    });

    renderWheel();

    save();
}

/* SAVE */

function save(){

    localStorage.setItem(
        "restaurants",
        JSON.stringify(restaurants)
    );
}

/* ADD */

function addRestaurant(){

    const input =
    document.getElementById("restaurantInput");

    const value = input.value.trim();

    if(!value) return;

    restaurants.push({
        name:value,
        crossed:false
    });

    input.value = "";

    render();
}

/* DELETE */

function deleteRestaurant(index){

    restaurants.splice(index,1);

    render();
}

/* CROSS OFF */

function toggleCross(index){

    restaurants[index].crossed =
    !restaurants[index].crossed;

    render();
}

/* WHEEL */

function renderWheel(){

    track.innerHTML = "";

    const active =
    restaurants.filter(r=>!r.crossed);

    const repeated = [
        ...active,
        ...active,
        ...active,
        ...active
    ];

    repeated.forEach(r=>{

        const div =
        document.createElement("div");

        div.className = "spin-card";

        div.innerText = r.name;

        track.appendChild(div);

    });
}

/* SPIN */

function spinWheel(){

    const active =
    restaurants.filter(r=>!r.crossed);

    if(active.length === 0){

        alert("Add restaurants first");

        return;
    }

    const winnerIndex =
    Math.floor(Math.random() * active.length);

    const winner =
    active[winnerIndex];

    const cardHeight = 145;

    const loops =
    active.length * 2;

    const finalIndex =
    loops + winnerIndex;

    const offset =
    (finalIndex * cardHeight) - 190;

    track.style.transition =
    "transform 5.8s cubic-bezier(.12,.89,.16,1)";

    track.style.transform =
    `translateY(-${offset}px)`;

    document.getElementById("winnerText")
    .innerHTML =
    `✨ Tonight: ${winner.name} ✨`;
}

render();

</script>

</body>
</html>
