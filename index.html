<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Dinner Picker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #f6f1e7;
    color: #4b463f;
}

header {
    text-align: center;
    padding: 25px;
}

header h1 {
    margin: 0;
    font-size: 42px;
}

header p {
    opacity: 0.7;
}

.main-layout {
    width: 95%;
    max-width: 1500px;
    margin: auto;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 30px;
    padding-bottom: 50px;
}

.panel {
    background: #fffaf2;
    border-radius: 28px;
    padding: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.input-row {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    border: none;
    border-radius: 16px;
    padding: 14px;
    font-size: 16px;
    background: #efe7da;
    outline: none;
}

button {
    border: none;
    background: #8ca67f;
    color: white;
    border-radius: 16px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

.restaurant-list {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 70vh;
    overflow-y: auto;
}

.restaurant-item {
    background: #f7f0e3;
    border-radius: 18px;
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.restaurant-item.disabled {
    opacity: 0.45;
    text-decoration: line-through;
}

.restaurant-name {
    font-weight: 700;
    font-size: 16px;
}

.actions {
    display: flex;
    gap: 8px;
}

.small-btn {
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13px;
}

.spinner-panel {
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.spinner-wrapper {
    position: relative;
    height: 240px;
    overflow: hidden;
    border-radius: 30px;
    background: #efe5d5;
    display: flex;
    align-items: center;
}

.spinner-track {
    display: flex;
    gap: 18px;
    padding-left: 40px;
    will-change: transform;
}

.restaurant-card {
    min-width: 220px;
    height: 160px;
    border-radius: 24px;
    background: linear-gradient(145deg, #fffefb, #ece2d1);
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    font-size: 24px;
    font-weight: 900;
    color: #5a5148;
    transition: 0.25s;
}

.restaurant-card.winner {
    transform: scale(1.08);
    box-shadow: 0 0 35px rgba(140,166,127,0.7);
    background: linear-gradient(145deg, #fffdf7, #f2ead7);
}

.center-line {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    width: 8px;
    height: 100%;
    background: rgba(140,166,127,0.7);
    border-radius: 999px;
    z-index: 5;
}

.result-box {
    text-align: center;
    background: #f3eadb;
    border-radius: 24px;
    padding: 30px;
}

.result-box h2 {
    margin-top: 0;
}

#winner-name {
    font-size: 42px;
    font-weight: 900;
    color: #6c8a61;
}

.spin-btn {
    font-size: 20px;
    padding: 18px;
    border-radius: 20px;
}

@media (max-width: 950px) {
    .main-layout {
        grid-template-columns: 1fr;
    }

    .restaurant-card {
        min-width: 170px;
        font-size: 18px;
    }
}
</style>
</head>
<body>

<header>
    <h1>🍽 Family Dinner Picker</h1>
    <p>Pick tonight's restaurant with a Hearthstone-style spin!</p>
</header>

<div class="main-layout">

    <div class="panel">
        <div class="input-row">
            <input id="restaurant-input" placeholder="Add restaurant..." />
            <button onclick="addRestaurant()">Add</button>
        </div>

        <div class="restaurant-list" id="restaurant-list"></div>
    </div>

    <div class="spinner-panel">

        <div class="panel">
            <div class="spinner-wrapper">
                <div class="center-line"></div>
                <div class="spinner-track" id="spinner-track"></div>
            </div>
        </div>

        <button class="spin-btn" onclick="spinRestaurants()">
            SPIN FOR DINNER
        </button>

        <div class="result-box">
            <h2>Tonight's Pick</h2>
            <div id="winner-name">???</div>
        </div>

    </div>

</div>

<script>
let restaurants = JSON.parse(localStorage.getItem("restaurants")) || [];

function saveRestaurants() {
    localStorage.setItem("restaurants", JSON.stringify(restaurants));
}

function addRestaurant() {
    const input = document.getElementById("restaurant-input");
    const name = input.value.trim();

    if (!name) return;

    restaurants.push({
        name,
        disabled: false
    });

    input.value = "";

    saveRestaurants();
    renderRestaurants();
}

function removeRestaurant(index) {
    restaurants.splice(index, 1);
    saveRestaurants();
    renderRestaurants();
}

function toggleRestaurant(index) {
    restaurants[index].disabled = !restaurants[index].disabled;
    saveRestaurants();
    renderRestaurants();
}

function renderRestaurants() {
    const list = document.getElementById("restaurant-list");
    list.innerHTML = "";

    restaurants.forEach((restaurant, index) => {
        const item = document.createElement("div");
        item.className = "restaurant-item";

        if (restaurant.disabled) {
            item.classList.add("disabled");
        }

        item.innerHTML = `
            <div class="restaurant-name">${restaurant.name}</div>

            <div class="actions">
                <button class="small-btn" onclick="toggleRestaurant(${index})">
                    ${restaurant.disabled ? "Undo" : "Cross Off"}
                </button>

                <button class="small-btn" onclick="removeRestaurant(${index})">
                    Delete
                </button>
            </div>
        `;

        list.appendChild(item);
    });
}

function spinRestaurants() {
    const enabled = restaurants.filter(r => !r.disabled);

    if (enabled.length === 0) {
        alert("Add restaurants first!");
        return;
    }

    const track = document.getElementById("spinner-track");
    track.innerHTML = "";

    const spinPool = [];

    for (let i = 0; i < 40; i++) {
        const randomRestaurant = enabled[Math.floor(Math.random() * enabled.length)];
        spinPool.push(randomRestaurant);
    }

    const winner = enabled[Math.floor(Math.random() * enabled.length)];

    spinPool.push(winner);

    spinPool.forEach(r => {
        const card = document.createElement("div");
        card.className = "restaurant-card";
        card.textContent = r.name;
        track.appendChild(card);
    });

    const cards = [...document.querySelectorAll(".restaurant-card")];

    const winnerIndex = cards.length - 1;
    const cardWidth = 238;

    const offset = (winnerIndex * cardWidth) - (window.innerWidth / 2) + 150;

    track.style.transition = "none";
    track.style.transform = "translateX(0px)";

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            track.style.transition = "transform 6s cubic-bezier(0.08,0.8,0.15,1)";
            track.style.transform = `translateX(-${offset}px)`;
        });
    });

    setTimeout(() => {
        cards[winnerIndex].classList.add("winner");
        document.getElementById("winner-name").textContent = winner.name;
    }, 6100);
}

renderRestaurants();

window.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        addRestaurant();
    }
});
</script>

</body>
</html>
